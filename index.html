      if (group.activity === "fundive" || group.activity === "courses") {
        if (group.activity !== "courses") group.course = "";
        else if (group.course !== "OW" && group.course !== "AOW") group.course = "";
        if (!String(group.context ?? "").trim()) group.context = "—";
        return group;
      }
      const raw = String(group.context ?? "").trim();
      const parts = raw.split(/\s*[·•]\s*/).map(part => part.trim()).filter(Boolean);
      const first = (parts[0] || "").toLowerCase();
      if (first === "fundive" || first === "fun dive" || first === "fun-dive") {
        group.activity = "fundive";
        group.course = "";
        group.context = parts.slice(1).join(" · ") || "—";
        return group;
      }
      if (first === "course" || first === "courses") {
        const rest = parts.slice(1);
        const level = (rest[0] || "").toUpperCase();
        group.activity = "courses";
        if (level === "OW" || level === "AOW") {
          group.course = level;
          group.context = rest.slice(1).join(" · ") || "—";
        } else {
          group.course = "";
          group.context = rest.join(" · ") || "—";
        }
        return group;
      }
      group.activity = group.activity || "";
      group.course = group.course || "";
      if (!raw) group.context = "—";
      return group;
    }

    function formatGroupHeadline(group) {
      const activity = group?.activity === "fundive" ? "Fundive"
        : group?.activity === "courses" ? (group.course ? `Courses · ${group.course}` : "Courses")
        : "";
      const notes = String(group?.context ?? "").trim();
      const hasNotes = notes && notes !== "—" && notes !== "-";
      if (activity && hasNotes) return `${activity} · ${notes}`;
      if (activity) return activity;
      return hasNotes ? notes : "—";
    }

    function ensureDmRoster(data) {
      if (!Array.isArray(data.dmRoster)) data.dmRoster = [];
      data.dmRoster = data.dmRoster.map((item, index) => ({
        id: item?.id || `dm-${index + 1}-${Math.random().toString(36).slice(2, 7)}`,
        name: String(item?.name ?? "").trim(),
        photo: typeof item?.photo === "string" ? item.photo : ""
      }));
      const knownIds = new Set(data.dmRoster.map(item => item.id));
      const knownNames = new Set(data.dmRoster.map(item => item.name.toLowerCase()).filter(Boolean));
      for (const item of BOARD_DATA.dmRoster || []) {
        const name = String(item?.name || "").trim().toLowerCase();
        if (!item?.id || knownIds.has(item.id) || (name && knownNames.has(name))) continue;
        data.dmRoster.push({
          id: item.id,
          name: String(item.name || "").trim(),
          photo: typeof item.photo === "string" ? item.photo : ""
        });
        knownIds.add(item.id);
        if (name) knownNames.add(name);
      }
      const putuDefault = (BOARD_DATA.dmRoster || []).find(item => item?.id === "dm-putu");
      if (putuDefault?.photo) {
        for (const item of data.dmRoster) {
          const isPutu = item.id === "dm-putu" || item.name.toLowerCase() === "putu";
          if (isPutu && (!item.photo || item.photo.includes("/wAARCAIIASQ"))) {
            item.photo = putuDefault.photo;
          }
        }
      }
      for (const id of requiredSessionIds) {
        for (const group of data.sessions?.[id]?.groups || []) {
          if (typeof group.dmId !== "string") group.dmId = "";
          migrateGroupActivity(group);
        }
      }
      return data;
    }

    function normalizeGroupCount(data) {
      const emptyGroup = () => structuredClone({
        marker: "?",
        dm: "unassigned",
        capacity: "0/3",
        activity: "",
        course: "",
        context: "—",
        divers: [
          { name: "open", note: "" },
          { name: "open", note: "" },
          { name: "open", note: "" }
        ]
      });
      for (const id of requiredSessionIds) {
        const session = data?.sessions?.[id];
        if (!session || !Array.isArray(session.groups)) continue;
        while (session.groups.length < 9) session.groups.push(emptyGroup());
        session.groups = session.groups.slice(0, 9);
      }
      return data;
    }

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return ensureDmRoster(structuredClone(BOARD_DATA));
        const parsed = ensureDmRoster(normalizeGroupCount(JSON.parse(saved)));
        return validateData(parsed) ? parsed : ensureDmRoster(structuredClone(BOARD_DATA));
      } catch (error) {
        return ensureDmRoster(structuredClone(BOARD_DATA));
      }
    }

    function validInterval(value) {
      const seconds = Number(value);
      return Number.isInteger(seconds) && seconds >= 1 && seconds <= 3600;
    }

    function loadPlaybackPreferences() {
      try {
        const parsed = JSON.parse(localStorage.getItem(PLAYBACK_STORAGE_KEY) || "null");
        return {
          loop: Boolean(parsed?.loop),
          intervalSeconds: validInterval(parsed?.intervalSeconds) ? Number(parsed.intervalSeconds) : 5
        };
      } catch (error) {
        return { loop: false, intervalSeconds: 5 };
      }
    }

    const playbackPreferences = loadPlaybackPreferences();
    const state = {
      activeView: "overview",
      editing: false,
      autoplay: false,
      autoplayTimer: null,
      loop: playbackPreferences.loop,
      intervalSeconds: playbackPreferences.intervalSeconds,
      data: loadData()
    };

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>'"]/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[character]);
    }

    const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const MONTH_INDEX = Object.fromEntries(MONTHS.map((month, index) => [month, index]));

    function parseBoardDate(display) {
      const match = String(display ?? "").trim().match(/^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})$/);
      if (!match) return null;
      const day = Number(match[1]);
      const month = MONTH_INDEX[match[2].toUpperCase()];
      const year = Number(match[3]);
      if (month === undefined) return null;
      const date = new Date(year, month, day);
      if (date.getFullYear() !== year || date.getMonth() !== month || date.getDate() !== day) return null;
      return date;
    }

    function formatBoardDate(date) {
      return `${date.getDate()} ${MONTHS[date.getMonth()]} ${date.getFullYear()}`;
    }

    function formatWeekday(date) {
      return date.toLocaleDateString("en-US", { weekday: "long" });
    }

    function baliToday() {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Makassar",
        year: "numeric",
        month: "short",
        day: "numeric",
        weekday: "long"
      }).formatToParts(new Date());
      const pick = type => parts.find(part => part.type === type)?.value || "";
      return {
        display: `${Number(pick("day"))} ${pick("month").slice(0, 3).toUpperCase()} ${pick("year")}`,
        weekday: pick("weekday")
      };
    }

    function stampBoardToToday(data) {
      if (!data?.date) return false;
      const today = baliToday();
      if (data.date.display === today.display && data.date.weekday === today.weekday) return false;
      data.date.display = today.display;
      data.date.weekday = today.weekday;
      return true;
    }

    function persistBoardQuietly() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      } catch {}
    }

    function msUntilNextBaliMidnight() {
      const iso = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Makassar",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
      const [year, month, day] = iso.split("-").map(Number);
      const next = Date.UTC(year, month - 1, day + 1, 0, 0, 0) - 8 * 60 * 60 * 1000;
      return Math.max(1000, next - Date.now() + 250);
    }

    function armDateRollover() {
      setTimeout(() => {
        if (stampBoardToToday(state.data)) {
          persistBoardQuietly();
          renderApp();
        }
        armDateRollover();
      }, msUntilNextBaliMidnight());
    }

    function toDateInputValue(display) {
      const parsed = parseBoardDate(display);
      if (!parsed) return "";
      const month = String(parsed.getMonth() + 1).padStart(2, "0");
      const day = String(parsed.getDate()).padStart(2, "0");
      return `${parsed.getFullYear()}-${month}-${day}`;
    }

    function syncDateDerivedFields(displayValue) {
      const parsed = parseBoardDate(displayValue);
      if (!parsed) return false;
      const weekday = formatWeekday(parsed);
      state.data.date.display = formatBoardDate(parsed);
      state.data.date.weekday = weekday;
      board.querySelectorAll('input[data-path="date.display"]').forEach(input => {
        if (input.dataset.kind === "date") input.value = toDateInputValue(state.data.date.display);
        else input.value = state.data.date.display;
      });
      board.querySelectorAll('input[data-path="date.weekday"]').forEach(input => {
        input.value = weekday;
      });
      board.querySelectorAll("[data-date-display]").forEach(node => {
        node.textContent = state.data.date.display;
      });
      board.querySelectorAll("[data-date-weekday]").forEach(node => {
        node.textContent = weekday;
      });
      return true;
    }

    function editableField(path, value, label, options = {}) {
      if (!state.editing) {
        if (path === "date.display") return `<span data-date-display>${escapeHTML(value)}</span>`;
        if (path === "date.weekday") return `<span data-date-weekday>${escapeHTML(value)}</span>`;
        return escapeHTML(value);
      }
      if (path === "date.display") {
        const className = options.className ? ` ${options.className}` : "";
        return `<input class="edit-field edit-date${className}" type="date" data-path="date.display" data-kind="date" aria-label="${escapeHTML(label)}" value="${escapeHTML(toDateInputValue(value))}">`;
      }
      if (path === "date.weekday") {
        return `<input class="edit-field edit-weekday" type="text" data-path="date.weekday" data-kind="text" readonly tabindex="-1" aria-label="${escapeHTML(label)} (auto from date)" value="${escapeHTML(value)}">`;
      }
      const type = options.type || "text";
      const inputMode = type === "number" ? " inputmode=\"numeric\"" : "";
      const className = options.className ? ` ${options.className}` : "";
      return `<input class="edit-field${className}" type="${type}"${inputMode} data-path="${escapeHTML(path)}" data-kind="${type}" aria-label="${escapeHTML(label)}" value="${escapeHTML(value)}">`;
    }

    function isGroupEmpty(group) {
      return isPlaceholderDm(resolveDmName(group)) && countGroupDivers(group) === 0;
    }

    function renderOverview(data) {
      const rows = data.overview.map((item, index) => {
        const empty = Number(item.dmGroups) === 0 && Number(item.divers) === 0;
        return `
        <section class="schedule-column" data-slot="${escapeHTML(item.id)}" data-empty="${empty}" ${state.editing ? "" : `data-jump="${escapeHTML(item.id)}" role="button" tabindex="0"`} aria-label="${state.editing ? "Edit" : "Open"} ${escapeHTML(item.time)} board">
          <div class="schedule-time-block">
            <h2 class="schedule-time">${editableField(`overview.${index}.time`, item.time, `Time slot ${index + 1}`, { className: "edit-inline" })}</h2>
            <p class="schedule-tide-caption" data-tide-slot="${escapeHTML(item.id)}"><span>SEA</span><strong>—</strong></p>
          </div>
          <div class="schedule-metric"><span>DM GROUPS</span><strong data-auto-metric="overview.${index}.dmGroups">${escapeHTML(item.dmGroups)}</strong></div>
          <div class="schedule-metric"><span>DIVERS</span><strong data-auto-metric="overview.${index}.divers">${escapeHTML(item.divers)}</strong></div>
          <div class="schedule-site"><span>SITE</span><strong>${editableField(`overview.${index}.site`, item.site, `Dive site for ${item.time}`)}</strong></div>
        </section>`;
      }).join("");

      return `
        <article class="original-overview">
          <header class="overview-brand-row">
            <div class="udive-logo">
              <img class="udive-logo-image" src="assets/udivebali-logo.png" alt="UDiveBali" width="1440" height="511">
            </div>
            <div class="deck-date-card">
              <span class="date-label">DATE</span>
              <strong>${editableField("date.display", data.date.display, "Board date")}</strong>
              <small>${editableField("date.weekday", data.date.weekday, "Weekday")}</small>
            </div>
          </header>
          <h1 class="deck-title">TULAMBEN · DAILY DIVE BOARD</h1>
          <section class="tide-strip" data-tide-strip aria-label="Tulamben tide and wave" title="Modeled Tulamben tide and wave · WITA · not for navigation">
            <div class="tide-strip-copy">
              <span class="tide-kicker">Tulamben sea</span>
              <strong class="tide-now" data-tide-now>Loading tide…</strong>
              <span class="tide-extrema" data-tide-extrema></span>
              <p class="tide-note" data-tide-note>Modeled sea level and wave · WITA · not for navigation</p>
            </div>
            <svg class="tide-spark" data-tide-spark viewBox="0 0 96 28" aria-hidden="true"></svg>
          </section>
          <div class="schedule-grid">${rows}</div>
          <footer class="slide-footer"><span>${editableField("overviewSafety", data.overviewSafety, "Overview safety note")}</span><strong>UDIVEBALI TULAMBEN</strong></footer>
        </article>`;
    }

    function renderSession(session, data) {
      const sessionPath = `sessions.${state.activeView}`;
      const groups = session.groups.map((group, groupIndex) => {
        const empty = isGroupEmpty(group);
        const divers = group.divers.map((diver, diverIndex) => `
          <li class="diver-row">
            <span class="diver-index">${diverIndex + 1}</span>
            <span class="diver-name">${editableField(`${sessionPath}.groups.${groupIndex}.divers.${diverIndex}.name`, diver.name, `Group ${groupIndex + 1} diver ${diverIndex + 1}`)}</span>
            <span class="diver-note">${editableField(`${sessionPath}.groups.${groupIndex}.divers.${diverIndex}.note`, diver.note, `Note for group ${groupIndex + 1} diver ${diverIndex + 1}`, { className: "edit-inline" })}</span>
          </li>`).join("");
        return `
          <section class="group-cell" data-group-index="${groupIndex}" data-open="${group.dm === "unassigned"}" data-empty="${empty}" aria-label="Group ${groupIndex + 1}">
            <div class="group-dm-pane">
              <div class="group-top">
                <span class="dm-block"><span class="micro-label">DM</span><strong class="dm-name">${escapeHTML(resolveDmName(group))}</strong></span>
              </div>
              ${renderDmPhoto(group)}
              ${state.editing ? renderDmSelect(groupIndex, group) : ""}
            </div>
            <div class="group-guest-pane">
              <div class="guest-meta">
                ${state.editing
                  ? `<div class="group-activity-row">${renderActivitySelect(groupIndex, group)}${group.activity === "courses" ? renderCourseSelect(groupIndex, group) : ""}</div>`
                  : `<p class="group-context">${escapeHTML(formatGroupHeadline(group))}</p>`}
                <span class="capacity" data-auto-capacity="${groupIndex}">${escapeHTML(group.capacity)}</span>
              </div>
              ${state.editing ? `<p class="group-context">${editableField(`${sessionPath}.groups.${groupIndex}.context`, group.context, `Group ${groupIndex + 1} site and notes`)}</p>` : ""}
              <ol class="diver-list">${divers}</ol>
              ${state.editing ? `<div class="group-copy-row">
                <button type="button" class="paste-names-btn" data-paste-group="${groupIndex}" aria-label="Paste guest names into group ${groupIndex + 1}">Paste names</button>
                <button type="button" class="copy-names-btn" data-copy-group="${groupIndex}" aria-label="Copy 3 guest names from group ${groupIndex + 1}">Copy names</button>
              </div>` : ""}
            </div>
          </section>`;
      }).join("");

      const showBriefing = state.editing || (session.sourceTime && session.sourceTime !== session.displayTime);
      const briefing = showBriefing
        ? `<p class="session-briefing">Briefing ${editableField(`${sessionPath}.sourceTime`, session.sourceTime, "Briefing time", { className: "edit-inline" })}</p>`
        : "";
      const totals = computeSessionTotals(session);

      return `
        <article class="original-session">
          <header class="session-header">
            <div class="session-time-block">
              <h1 class="session-time">${editableField(`${sessionPath}.displayTime`, session.displayTime, "Session time", { className: "edit-inline" })}</h1>
              ${briefing}
            </div>
            <div class="session-summary-line">
              <div class="schedule-metric"><span>DM GROUPS</span><strong data-auto-session-dm>${escapeHTML(totals.dmGroups)}</strong></div>
              <div class="schedule-metric"><span>DIVERS</span><strong data-auto-session-divers>${escapeHTML(totals.divers)}</strong></div>
            </div>
            <div class="session-date">
              ${editableField("date.display", data.date.display, "Board date")}
              <p class="session-tide" data-tide-session>Loading tide…</p>
            </div>
          </header>
          <div class="group-grid">${groups}</div>
          <footer class="slide-footer"><span>${editableField("safety", data.safety, "Safety note")}</span><strong>UDIVEBALI TULAMBEN</strong></footer>
        </article>`;
    }

    function syncNavigation() {
      navButtons.forEach(button => {
        const current = button.dataset.view === state.activeView;
        if (current) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });
    }

    function syncPlaybackControls() {
      autoplayToggle.setAttribute("aria-pressed", String(state.autoplay));
      autoplayToggle.textContent = state.autoplay ? "Autoplay: Playing" : "Autoplay: Off";
      loopToggle.setAttribute("aria-pressed", String(state.loop));
      loopToggle.textContent = state.loop ? "Loop: On" : "Loop: Off";
      const preset = [5, 10, 15, 30, 60].includes(state.intervalSeconds);
      intervalSelect.value = preset ? String(state.intervalSeconds) : "custom";
      customIntervalControl.hidden = preset;
      customInterval.value = String(state.intervalSeconds);
    }

    function setActiveView(view, { restartTimer = true } = {}) {
      if (!VIEWS.includes(view)) return;
      state.activeView = view;
      renderApp();
      if (restartTimer && state.autoplay) scheduleNextView();
    }

    function setAtPath(target, path, value) {
      const keys = path.split(".");
      const finalKey = keys.pop();
      const parent = keys.reduce((current, key) => current[key], target);
      parent[finalKey] = value;
    }

    let statusTimer;
    function showStatus(message, kind = "ok") {
      clearTimeout(statusTimer);
      statusMessage.textContent = message;
      statusMessage.dataset.kind = kind;
      statusTimer = setTimeout(() => { statusMessage.textContent = ""; }, 3600);
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
        showStatus("Changes saved on this device");
        return true;
      } catch (error) {
        showStatus("Changes are active, but browser storage is unavailable", "error");
        return false;
      }
    }

    function savePlaybackPreferences() {
      try {
        localStorage.setItem(PLAYBACK_STORAGE_KEY, JSON.stringify({
          loop: state.loop,
          intervalSeconds: state.intervalSeconds
        }));
      } catch (error) {
        showStatus("Playback settings could not be saved", "error");
      }
    }

    function clearAutoplayTimer() {
      if (state.autoplayTimer !== null) clearTimeout(state.autoplayTimer);
      state.autoplayTimer = null;
    }

    function scheduleNextView() {
      clearAutoplayTimer();
      if (!state.autoplay || state.editing) return;
      state.autoplayTimer = setTimeout(() => {
        const currentIndex = VIEWS.indexOf(state.activeView);
        const atLastView = currentIndex === VIEWS.length - 1;
        if (atLastView && !state.loop) {
          stopAutoplay("Autoplay finished");
          return;
        }
        setActiveView(VIEWS[(currentIndex + 1) % VIEWS.length], { restartTimer: true });
      }, state.intervalSeconds * 1000);
    }

    let chromeHideTimer;
    function setPresenting(on) {
      document.body.classList.toggle("is-presenting", on);
      if (!on) {
        document.body.classList.remove("is-chrome-visible");
        clearTimeout(chromeHideTimer);
      }
    }

    function revealChrome() {
      if (!state.autoplay) return;
      document.body.classList.add("is-chrome-visible");
      clearTimeout(chromeHideTimer);
      chromeHideTimer = setTimeout(() => {
        document.body.classList.remove("is-chrome-visible");
      }, 2600);
    }

    function startAutoplay() {
      if (state.editing) return;
      state.autoplay = true;
      setPresenting(true);
      syncPlaybackControls();
      scheduleNextView();
      showStatus(`Autoplay started · ${state.intervalSeconds} sec`);
    }

    function stopAutoplay(message = "Autoplay stopped") {
      state.autoplay = false;
      setPresenting(false);
      clearAutoplayTimer();
      syncPlaybackControls();
      showStatus(message);
    }

    function bindEditableFields() {
      board.querySelectorAll("input[data-path]").forEach(input => input.addEventListener("input", () => {
        const path = input.dataset.path;
        let value;
        if (input.dataset.kind === "number") value = Number(input.value);
        else if (input.dataset.kind === "date") {
          if (!input.value) return;
          const parsed = new Date(`${input.value}T00:00:00`);
          if (Number.isNaN(parsed.getTime())) return;
          value = formatBoardDate(parsed);
        } else value = input.value;

        setAtPath(state.data, path, value);

        board.querySelectorAll(`input[data-path="${CSS.escape(path)}"]`).forEach(peer => {
          if (peer === input) return;
          if (peer.dataset.kind === "date") peer.value = toDateInputValue(String(value));
          else if (String(peer.value) !== String(value)) peer.value = value;
        });

        if (path === "date.display") {
          syncDateDerivedFields(String(value));
          window.DiveTide?.refresh?.();
        }
        if (/\.groups\.\d+\.dm$/.test(path) || /\.divers\.\d+\.name$/.test(path)) {
          updateLiveDerivedDisplays();
        }

        saveState();
      }));
    }

    function createDmId() {
      return `dm-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
    }

    function getDmRoster() {
      if (!Array.isArray(state.data.dmRoster)) state.data.dmRoster = [];
      return state.data.dmRoster;
    }

    function findDmById(id) {
      if (!id) return null;
      return getDmRoster().find(item => item.id === id) || null;
    }

    function findDmByName(name) {
      const normalized = String(name ?? "").trim().toLowerCase();
      if (!normalized || normalized === "-" || normalized === "—" || normalized === "unassigned" || normalized === "?") return null;
      return getDmRoster().find(item => String(item.name || "").trim().toLowerCase() === normalized) || null;
    }

    function resolveDmRecord(group) {
      return findDmById(group?.dmId) || findDmByName(group?.dm);
    }

    function resolveDmName(group) {
      const record = resolveDmRecord(group);
      if (record?.name) return record.name;
      const raw = String(group?.dm ?? "").trim();
      return raw || "-";
    }

    function dmInitials(name) {
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return "?";
      return parts.slice(0, 2).map(part => part[0]?.toUpperCase() || "").join("") || "?";
    }

    function renderDmPhoto(group) {
      const record = resolveDmRecord(group);
      const name = resolveDmName(group);
      if (record?.photo) {
        return `<div class="dm-photo" aria-hidden="true"><img src="${escapeHTML(record.photo)}" alt=""></div>`;
      }
      const open = !name || ["-", "—", "unassigned", "?"].includes(name.toLowerCase());
      return `<div class="dm-photo" aria-hidden="true">${open ? "?" : escapeHTML(dmInitials(name))}</div>`;
    }

    function renderDmSelect(groupIndex, group) {
      const roster = getDmRoster();
      const selectedId = group.dmId || findDmByName(group.dm)?.id || "";
      const options = [
        `<option value="">Unassigned</option>`,
        ...roster.map(item => {
          const label = item.name?.trim() || "Untitled DM";
          const selected = item.id === selectedId ? " selected" : "";
          return `<option value="${escapeHTML(item.id)}"${selected}>${escapeHTML(label)}</option>`;
        })
      ].join("");
      return `<select class="dm-select" data-dm-select="${groupIndex}" aria-label="Select DM for group ${groupIndex + 1}">${options}</select>`;
    }

    function renderActivitySelect(groupIndex, group) {
      const selected = group.activity === "fundive" || group.activity === "courses" ? group.activity : "";
      const option = (value, label) => `<option value="${value}"${selected === value ? " selected" : ""}>${label}</option>`;
      return `<select class="activity-select" data-activity-select="${groupIndex}" aria-label="Fundive or courses for group ${groupIndex + 1}">${option("", "Type")}${option("fundive", "Fundive")}${option("courses", "Courses")}</select>`;
    }

    function renderCourseSelect(groupIndex, group) {
      const selected = group.course === "AOW" ? "AOW" : group.course === "OW" ? "OW" : "";
      const option = (value, label) => `<option value="${value}"${selected === value ? " selected" : ""}>${label}</option>`;
      return `<select class="course-select" data-course-select="${groupIndex}" aria-label="OW or AOW for group ${groupIndex + 1}">${option("", "Level")}${option("OW", "OW")}${option("AOW", "AOW")}</select>`;
    }

    function syncGroupDmLabelsFromRoster() {
      const roster = getDmRoster();
      const byId = Object.fromEntries(roster.map(item => [item.id, item]));
      for (const id of requiredSessionIds) {
        for (const group of state.data.sessions[id].groups) {
          if (group.dmId && byId[group.dmId]) {
            group.dm = byId[group.dmId].name?.trim() || "unassigned";
            if (!group.dm) group.dm = "unassigned";
          } else if (group.dmId && !byId[group.dmId]) {
            group.dmId = "";
            group.dm = "unassigned";
          }
        }
      }
    }

    async function fileToDmPhoto(file) {
      if (!file || !file.type.startsWith("image/")) throw new Error("Not an image");
      const objectUrl = URL.createObjectURL(file);
      try {
        const image = await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("Could not read image"));
          img.src = objectUrl;
        });
        const maxWidth = 360;
        const maxHeight = 520;
        const scale = Math.min(1, maxWidth / image.width, maxHeight / image.height);
        const width = Math.max(1, Math.round(image.width * scale));
        const height = Math.max(1, Math.round(image.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#f4f7f7";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(image, 0, 0, width, height);
        return canvas.toDataURL("image/jpeg", 0.74);
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    }

    function renderDmRosterPanel() {
      const list = document.querySelector("#dm-roster-list");
      const roster = getDmRoster();
      if (!roster.length) {
        list.innerHTML = `<p class="dm-roster-empty">No dive masters yet. Upload a photo, then type the name under it.</p>`;
        return;
      }
      list.innerHTML = roster.map((item, index) => `
        <article class="dm-roster-card" data-dm-id="${escapeHTML(item.id)}">
          <div class="dm-photo">${item.photo ? `<img src="${escapeHTML(item.photo)}" alt="">` : escapeHTML(dmInitials(item.name))}</div>
          <input type="text" data-dm-name="${escapeHTML(item.id)}" aria-label="DM name ${index + 1}" placeholder="Type DM name" value="${escapeHTML(item.name || "")}">
          <div class="dm-roster-card-actions">
            <label class="import-button" style="display:inline-grid;place-items:center;min-height:34px;padding:0 11px;border:1px solid rgba(18,59,75,.2);border-radius:4px;background:#faf8f2;cursor:pointer;font:750 10px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;">
              Replace photo
              <input type="file" accept="image/*" data-dm-replace="${escapeHTML(item.id)}" hidden>
            </label>
            <button type="button" class="danger" data-dm-remove="${escapeHTML(item.id)}">Remove</button>
          </div>
        </article>`).join("");

      list.querySelectorAll("[data-dm-name]").forEach(input => {
        input.addEventListener("input", () => {
          const record = findDmById(input.dataset.dmName);
          if (!record) return;
          record.name = input.value;
          syncGroupDmLabelsFromRoster();
          saveState();
        });
      });
      list.querySelectorAll("[data-dm-remove]").forEach(button => {
        button.addEventListener("click", () => {
          const id = button.dataset.dmRemove;
          state.data.dmRoster = getDmRoster().filter(item => item.id !== id);
          syncGroupDmLabelsFromRoster();
          saveState();
          renderDmRosterPanel();
          if (state.activeView !== "overview") renderApp();
        });
      });
      list.querySelectorAll("[data-dm-replace]").forEach(input => {
        input.addEventListener("change", async () => {
          const file = input.files?.[0];
          input.value = "";
          if (!file) return;
          try {
            const record = findDmById(input.dataset.dmReplace);
            if (!record) return;
            record.photo = await fileToDmPhoto(file);
            saveState();
            renderDmRosterPanel();
            if (state.activeView !== "overview") renderApp();
            showStatus("DM photo updated");
          } catch (error) {
            showStatus("Could not update photo", "error");
          }
        });
      });
    }

    function openDmRoster() {
      document.querySelector("#dm-roster-modal").hidden = false;
      renderDmRosterPanel();
    }

    function closeDmRoster() {
      document.querySelector("#dm-roster-modal").hidden = true;
      syncGroupDmLabelsFromRoster();
      saveState();
      renderApp();
    }

    function bindDmSelects() {
      board.querySelectorAll("[data-dm-select]").forEach(select => {
        select.addEventListener("change", () => {
          const groupIndex = Number(select.dataset.dmSelect);
          const group = state.data.sessions[state.activeView]?.groups?.[groupIndex];
          if (!group) return;
          const record = findDmById(select.value);
          if (!record) {
            group.dmId = "";
            group.dm = "unassigned";
          } else {
            group.dmId = record.id;
            group.dm = record.name?.trim() || "unassigned";
          }
          updateLiveDerivedDisplays();
          saveState();
          renderApp();
        });
      });
    }

    function bindActivitySelects() {
      board.querySelectorAll("[data-activity-select]").forEach(select => {
        select.addEventListener("change", () => {
          const groupIndex = Number(select.dataset.activitySelect);
          const group = state.data.sessions[state.activeView]?.groups?.[groupIndex];
          if (!group) return;
          group.activity = select.value === "fundive" || select.value === "courses" ? select.value : "";
          if (group.activity === "courses") {
            if (group.course !== "OW" && group.course !== "AOW") group.course = "OW";
          } else {
            group.course = "";
          }
          saveState();
          renderApp();
        });
      });
      board.querySelectorAll("[data-course-select]").forEach(select => {
        select.addEventListener("change", () => {
          const groupIndex = Number(select.dataset.courseSelect);
          const group = state.data.sessions[state.activeView]?.groups?.[groupIndex];
          if (!group) return;
          group.activity = "courses";
          group.course = select.value === "AOW" ? "AOW" : select.value === "OW" ? "OW" : "";
          saveState();
          renderApp();
        });
      });
    }

    function isPlaceholderName(name) {
      const normalized = String(name ?? "").trim().toLowerCase();
      return !normalized || normalized === "-" || normalized === "—" || normalized === "open";
    }

    function isPlaceholderDm(dm) {
      const normalized = String(dm ?? "").trim().toLowerCase();
      return !normalized || normalized === "-" || normalized === "—" || normalized === "unassigned" || normalized === "?";
    }

    function countGroupDivers(group) {
      return (group?.divers || []).filter(diver => !isPlaceholderName(diver?.name)).length;
    }

    function capacityMax(capacity, fallback = 3) {
      const match = String(capacity ?? "").trim().match(/^(?:\d+|-)\s*\/\s*(\d+)$/);
      return match ? Number(match[1]) : fallback;
    }

    function computeSessionTotals(session) {
      let divers = 0;
      let dmGroups = 0;
      for (const group of session?.groups || []) {
        divers += countGroupDivers(group);
        if (!isPlaceholderDm(group.dm)) dmGroups += 1;
      }
      return { dmGroups, divers };
    }

    function formatSessionSummary(dmGroups, divers) {
      return `${dmGroups} DM · ${divers} DIVERS`;
    }

    function syncDerivedCounts(data = state.data) {
      if (!data?.overview || !data?.sessions) return data;
      for (const item of data.overview) {
        const session = data.sessions[item.id];
        if (!session) continue;
        for (const group of session.groups || []) {
          group.capacity = `${countGroupDivers(group)}/${capacityMax(group.capacity)}`;
        }
        const totals = computeSessionTotals(session);
        item.dmGroups = totals.dmGroups;
        item.divers = totals.divers;
        session.summary = formatSessionSummary(totals.dmGroups, totals.divers);
      }
      return data;
    }

    function updateLiveDerivedDisplays() {
      syncDerivedCounts();
      if (state.activeView === "overview") {
        state.data.overview.forEach((item, index) => {
          const dmNode = board.querySelector(`[data-auto-metric="overview.${index}.dmGroups"]`);
          const diversNode = board.querySelector(`[data-auto-metric="overview.${index}.divers"]`);
          const column = board.querySelector(`[data-slot="${CSS.escape(item.id)}"]`);
          const empty = Number(item.dmGroups) === 0 && Number(item.divers) === 0;
          if (dmNode) dmNode.textContent = String(item.dmGroups);
          if (diversNode) diversNode.textContent = String(item.divers);
          if (column) column.dataset.empty = String(empty);
        });
        return;
      }
      const session = state.data.sessions[state.activeView];
      if (!session) return;
      const totals = computeSessionTotals(session);
      const dmNode = board.querySelector("[data-auto-session-dm]");
      const diversNode = board.querySelector("[data-auto-session-divers]");
      if (dmNode) dmNode.textContent = String(totals.dmGroups);
      if (diversNode) diversNode.textContent = String(totals.divers);
      session.groups.forEach((group, groupIndex) => {
        const capacityNode = board.querySelector(`[data-auto-capacity="${groupIndex}"]`);
        const cell = board.querySelector(`[data-group-index="${groupIndex}"]`);
        if (capacityNode) capacityNode.textContent = group.capacity;
        if (cell) cell.dataset.empty = String(isGroupEmpty(group));
      });
    }

    function groupGuestNames(group) {
      return (group?.divers || []).slice(0, 3).map(diver => String(diver?.name ?? "").trim());
    }

    function sortGuestNames(names) {
      return [...names].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base", numeric: true }));
    }

    function parseNameList(text) {
      return String(text ?? "")
        .split(/[\n\r,;|]+/)
        .map(name => name.trim())
        .filter(name => !isPlaceholderName(name));
    }

    function applySortedNamesToGroup(groupIndex, rawNames) {
      const group = state.data.sessions[state.activeView]?.groups?.[groupIndex];
      if (!group) return 0;
      const sorted = sortGuestNames(parseNameList(Array.isArray(rawNames) ? rawNames.join("\n") : rawNames)).slice(0, 3);
      for (let index = 0; index < 3; index += 1) {
        if (!group.divers[index]) group.divers[index] = { name: "-", note: "-" };
        group.divers[index].name = sorted[index] || "-";
      }
      syncDerivedCounts();
      return sorted.length;
    }

    async function copyText(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.append(area);
      area.select();
      const ok = document.execCommand("copy");
      area.remove();
      if (!ok) throw new Error("Copy failed");
    }

    async function readClipboardText() {
      if (navigator.clipboard?.readText) return navigator.clipboard.readText();
      throw new Error("Clipboard read unavailable");
    }

    function flashActionButton(button, key, idleLabel, activeLabel) {
      button.dataset[key] = "true";
      button.textContent = activeLabel;
      setTimeout(() => {
        button.dataset[key] = "false";
        button.textContent = idleLabel;
      }, 1600);
    }

    function bindCopyNameButtons() {
      board.querySelectorAll("[data-copy-group]").forEach(button => {
        button.addEventListener("click", async event => {
          event.preventDefault();
          event.stopPropagation();
          const groupIndex = Number(button.dataset.copyGroup);
          const session = state.data.sessions[state.activeView];
          const group = session?.groups?.[groupIndex];
          if (!group) {
            showStatus("Could not find this group", "error");
            return;
          }
          const usable = sortGuestNames(groupGuestNames(group).filter(name => !isPlaceholderName(name)));
          const text = usable.join("\n");
          if (!text) {
            showStatus("No guest names to copy", "error");
            return;
          }
          try {
            await copyText(text);
            flashActionButton(button, "copied", "Copy names", "Copied");
            showStatus(`Copied ${usable.length} guest name${usable.length === 1 ? "" : "s"}`);
          } catch (error) {
            showStatus("Could not copy names", "error");
          }
        });
      });

      board.querySelectorAll("[data-paste-group]").forEach(button => {
        button.addEventListener("click", async event => {
          event.preventDefault();
          event.stopPropagation();
          const groupIndex = Number(button.dataset.pasteGroup);
          try {
            const text = await readClipboardText();
            const count = applySortedNamesToGroup(groupIndex, text);
            if (!count) {
              showStatus("No guest names found to paste", "error");
              return;
            }
            saveState();
            renderApp();
            showStatus(`Pasted ${count} name${count === 1 ? "" : "s"} into this group`);
          } catch (error) {
            showStatus("Could not paste names — allow clipboard access or use Edit + Ctrl/Cmd+V", "error");
          }
        });
      });
    }

    function bindNamePasteDistribution() {
      board.querySelectorAll('input[data-path*=".divers."][data-path$=".name"]').forEach(input => {
        input.addEventListener("paste", event => {
          const text = event.clipboardData?.getData("text") ?? "";
          const names = parseNameList(text);
          if (names.length <= 1) return;
          const match = input.dataset.path.match(/^sessions\.[^.]+\.groups\.(\d+)\.divers\.\d+\.name$/);
          if (!match) return;
          event.preventDefault();
          const count = applySortedNamesToGroup(Number(match[1]), names);
          saveState();
          renderApp();
          showStatus(`Pasted ${count} name${count === 1 ? "" : "s"} into this group`);
        });
      });
    }

    function renderApp() {
      syncDerivedCounts();
      board.innerHTML = state.activeView === "overview"
        ? renderOverview(state.data)
        : renderSession(state.data.sessions[state.activeView], state.data);
      syncNavigation();
      syncPlaybackControls();
      setPresenting(state.autoplay && !state.editing);
      document.body.classList.toggle("is-editing", state.editing);
      editToggle.setAttribute("aria-pressed", String(state.editing));
      editToggle.textContent = state.editing ? "Finish editing" : "Edit board";
      bindEditableFields();
      bindCopyNameButtons();
      bindNamePasteDistribution();
      bindDmSelects();
      bindActivitySelects();
      board.querySelectorAll("[data-jump]").forEach(button => button.addEventListener("click", () => {
        setActiveView(button.dataset.jump);
      }));
      board.querySelectorAll("[data-jump]").forEach(button => button.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          setActiveView(button.dataset.jump);
        }
      }));
      window.DiveTide?.refresh?.();
    }

    function exportData() {
      try {
        const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `tulamben-dive-board-${state.data.date.display.replace(/\s+/g, "-").toLowerCase()}.json`;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
        showStatus("Board data exported");
      } catch (error) {
        showStatus("Could not export board data", "error");
      }
    }

    async function importData(file) {
      if (!file) return;
      try {
        const candidate = JSON.parse(await file.text());
        if (!validateData(candidate)) throw new Error("Invalid board structure");
        state.data = ensureDmRoster(normalizeGroupCount(candidate));
        saveState();
        renderApp();
        showStatus("Board data imported");
      } catch (error) {
        showStatus("Import failed — the current board was not changed", "error");
      }
    }

    function resetData() {
      if (!confirm("Restore the original board data? Saved edits will be removed.")) return;
      state.data = ensureDmRoster(structuredClone(BOARD_DATA));
      stampBoardToToday(state.data);
      saveState();
      renderApp();
      showStatus("Original board restored");
    }

    navButtons.forEach(button => button.addEventListener("click", () => {
      setActiveView(button.dataset.view);
    }));

    editToggle.addEventListener("click", () => {
      state.editing = !state.editing;
      if (state.editing) stopAutoplay("Autoplay paused for editing");
      renderApp();
      if (state.editing) board.querySelector("input, select")?.focus();
    });

    document.querySelector("#dm-roster-toggle").addEventListener("click", openDmRoster);
    document.querySelector("#dm-roster-close").addEventListener("click", closeDmRoster);
    document.querySelector("#dm-roster-done").addEventListener("click", closeDmRoster);
    document.querySelector("#dm-roster-modal").addEventListener("click", event => {
      if (event.target.id === "dm-roster-modal") closeDmRoster();
    });
    document.querySelector("#dm-roster-add-blank").addEventListener("click", () => {
      getDmRoster().push({ id: createDmId(), name: "", photo: "" });
      saveState();
      renderDmRosterPanel();
    });
    document.querySelector("#dm-roster-upload").addEventListener("change", async event => {
      const files = [...(event.target.files || [])];
      event.target.value = "";
      if (!files.length) return;
      try {
        for (const file of files) {
          const photo = await fileToDmPhoto(file);
          const guessed = file.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim();
          getDmRoster().push({ id: createDmId(), name: guessed, photo });
        }
        saveState();
        renderDmRosterPanel();
        showStatus(`Added ${files.length} DM photo${files.length === 1 ? "" : "s"}`);
      } catch (error) {
        showStatus("Could not upload DM photo", "error");
      }
    });
    document.querySelector("#export-button").addEventListener("click", exportData);
    document.querySelector("#import-input").addEventListener("change", event => {
      importData(event.target.files?.[0]);
      event.target.value = "";
    });
    document.querySelector("#reset-button").addEventListener("click", resetData);

    autoplayToggle.addEventListener("click", () => {
      if (state.autoplay) stopAutoplay();
      else startAutoplay();
    });

    loopToggle.addEventListener("click", () => {
      state.loop = !state.loop;
      savePlaybackPreferences();
      syncPlaybackControls();
      if (state.autoplay) scheduleNextView();
    });

    intervalSelect.addEventListener("change", () => {
      const custom = intervalSelect.value === "custom";
      customIntervalControl.hidden = !custom;
      if (custom) {
        customInterval.focus();
        return;
      }
      state.intervalSeconds = Number(intervalSelect.value);
      savePlaybackPreferences();
      syncPlaybackControls();
      if (state.autoplay) scheduleNextView();
    });

    function applyCustomInterval(showError = false) {
      if (!validInterval(customInterval.value)) {
        if (showError) {
          customInterval.value = String(state.intervalSeconds);
          showStatus("Enter a whole number from 1 to 3600 seconds", "error");
        }
        return false;
      }
      state.intervalSeconds = Number(customInterval.value);
      savePlaybackPreferences();
      if (state.autoplay) scheduleNextView();
      return true;
    }

    customInterval.addEventListener("input", () => {
      if (!applyCustomInterval(false)) {
        customInterval.setAttribute("aria-invalid", "true");
        showStatus("Enter a whole number from 1 to 3600 seconds", "error");
        return;
      }
      customInterval.removeAttribute("aria-invalid");
    });

    customInterval.addEventListener("change", () => {
      if (!applyCustomInterval(true)) {
        customInterval.removeAttribute("aria-invalid");
        return;
      }
      customInterval.removeAttribute("aria-invalid");
      syncPlaybackControls();
    });

    document.addEventListener("mousemove", revealChrome);
    document.addEventListener("pointerdown", revealChrome);

    document.addEventListener("keydown", event => {
      const tag = event.target?.tagName;
      if (["INPUT", "TEXTAREA", "SELECT"].includes(tag)) return;
      if (event.key === "Escape" && state.editing) {
        state.editing = false;
        renderApp();
        editToggle.focus();
        return;
      }
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      const direction = event.key === "ArrowRight" ? 1 : -1;
      const current = VIEWS.indexOf(state.activeView);
      setActiveView(VIEWS[(current + direction + VIEWS.length) % VIEWS.length]);
    });

    if (stampBoardToToday(state.data)) persistBoardQuietly();
    syncDerivedCounts();
    renderApp();
    armDateRollover();

    window.DiveBoard = {
      getData() {
        return state.data;
      },
      getDateISO() {
        const parsed = parseBoardDate(state.data.date.display);
        if (!parsed) return null;
        const month = String(parsed.getMonth() + 1).padStart(2, "0");
        const day = String(parsed.getDate()).padStart(2, "0");
        return `${parsed.getFullYear()}-${month}-${day}`;
      },
      getSlots() {
        return (state.data.overview || []).map(item => ({ id: item.id, time: item.time }));
      },
      applyBoardData(next) {
        try {
          state.data = ensureDmRoster(next);
          saveState();
          renderApp();
        } catch (error) {
          showStatus("Could not apply AI changes", "error");
        }
      }
    };
  </script>
  <script>
    window.DIVE_BOARD_AI_API_URL = window.DIVE_BOARD_AI_API_URL || "";
    window.VITE_AI_API_URL = window.VITE_AI_API_URL || window.DIVE_BOARD_AI_API_URL || "";
  </script>
