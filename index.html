<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tulamben Daily Dive Board</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #071014;
      --ink-raised: #0b171c;
      --panel: #0e1c22;
      --panel-soft: #11252b;
      --sea: #72d3bd;
      --sea-dim: #2b645f;
      --signal: #f2c955;
      --signal-hot: #ffdf79;
      --text: #edf5f1;
      --muted: #88a19e;
      --line: rgba(139, 204, 191, .2);
      --line-strong: rgba(139, 204, 191, .42);
      --danger: #ff8775;
      --shadow: 0 24px 80px rgba(0, 0, 0, .4);
      --display: "Arial Narrow", "Avenir Next Condensed", "Helvetica Neue", sans-serif;
      --body: "Avenir Next", "Helvetica Neue", sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--ink); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow-x: hidden;
      color: #123b4b;
      background: #ece8df;
      font-family: var(--body);
    }

    button, input { font: inherit; }
    button, .import-button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, .import-button:focus-within {
      outline: 2px solid var(--signal-hot);
      outline-offset: 3px;
    }

    .app-shell { position: relative; width: min(1560px, 100%); min-height: 100vh; margin: 0 auto; padding: 18px clamp(16px, 2.2vw, 38px) 24px; }
    .topbar {
      position: sticky;
      top: 12px;
      z-index: 20;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(16px, 2vw, 32px);
      padding: 11px 12px 11px 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(8, 20, 24, .86);
      box-shadow: 0 12px 40px rgba(0, 0, 0, .24);
      backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; font-family: var(--display); letter-spacing: .12em; }
    .brand span { color: var(--muted); font-size: 10px; }
    .brand strong { color: var(--sea); font-size: 16px; font-stretch: condensed; }
    .view-nav { display: flex; justify-content: center; gap: 5px; min-width: 0; }
    .view-nav button, #edit-toggle, .utility-bar button, .import-button {
      min-height: 38px;
      border: 1px solid transparent;
      border-radius: 9px;
      padding: 0 14px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      font-family: var(--display);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
      transition: color .18s ease, background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .view-nav button:hover, .utility-bar button:hover, .import-button:hover { color: var(--text); background: rgba(114, 211, 189, .07); }
    .view-nav button[aria-current="page"] { color: #071014; background: var(--sea); }
    #edit-toggle { border-color: var(--line-strong); color: var(--text); }
    #edit-toggle:hover { border-color: var(--signal); color: var(--signal); transform: translateY(-1px); }

    #board { min-height: calc(100vh - 152px); padding: clamp(28px, 4vw, 66px) 0 30px; }
    .board-kicker { margin: 0 0 12px; color: var(--sea); font: 800 11px/1 var(--display); letter-spacing: .34em; text-transform: uppercase; }
    .board-heading { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: clamp(28px, 4vw, 58px); }
    .board-title { margin: 0; font: 900 clamp(42px, 7vw, 102px)/.82 var(--display); letter-spacing: -.055em; text-transform: uppercase; }
    .board-title .outline { color: transparent; -webkit-text-stroke: 1px rgba(237, 245, 241, .48); }
    .date-lockup { flex: 0 0 auto; padding-left: 24px; border-left: 1px solid var(--line-strong); text-align: right; }
    .date-lockup strong { display: block; color: var(--signal); font: 900 clamp(18px, 2.1vw, 30px)/1 var(--display); letter-spacing: .05em; }
    .date-lockup span { display: block; margin-top: 8px; color: var(--muted); font: 700 11px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; }

    .overview-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line); }
    .slot-card {
      position: relative;
      display: flex;
      min-width: 0;
      min-height: clamp(260px, 31vh, 370px);
      flex-direction: column;
      align-items: stretch;
      padding: clamp(20px, 2.2vw, 34px);
      border: 0;
      border-right: 1px solid var(--line);
      color: var(--text);
      text-align: left;
      background: transparent;
      cursor: pointer;
      overflow: hidden;
    }
    .slot-card:last-child { border-right: 0; }
    .slot-card::before { content: ""; position: absolute; inset: auto 0 0; height: 0; background: linear-gradient(180deg, transparent, rgba(114, 211, 189, .1)); transition: height .25s ease; }
    .slot-card:hover::before { height: 100%; }
    .slot-topline { position: relative; display: flex; justify-content: space-between; gap: 12px; color: var(--sea); font: 800 10px/1 var(--display); letter-spacing: .16em; }
    .slot-time { position: relative; margin: auto 0 18px; color: var(--text); font: 900 clamp(43px, 5vw, 74px)/.8 var(--display); letter-spacing: -.055em; }
    .slot-status { position: relative; color: var(--signal); font: 900 12px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; }
    .slot-stats { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); }
    .slot-stats span, .slot-site span { display: block; color: var(--muted); font: 800 8px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; }
    .slot-stats strong { display: block; margin-top: 6px; font: 900 22px/1 var(--display); }
    .slot-site { position: relative; margin-top: 24px; }
    .slot-site strong { display: block; min-height: 2.2em; margin-top: 7px; font: 800 13px/1.1 var(--display); letter-spacing: .04em; text-transform: uppercase; }

    .session-heading { margin-bottom: clamp(20px, 3vw, 34px); }
    .session-meta { display: flex; gap: 18px; align-items: center; color: var(--muted); font: 800 11px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; }
    .session-meta .status { color: var(--signal); }
    .session-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .group-card {
      position: relative;
      min-width: 0;
      min-height: 240px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: linear-gradient(145deg, rgba(16, 39, 44, .82), rgba(8, 22, 27, .8));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.02);
    }
    .group-card::after { content: ""; position: absolute; top: -1px; left: 18px; width: 38px; height: 2px; background: var(--sea); }
    .group-top { display: grid; grid-template-columns: 42px 1fr auto; gap: 12px; align-items: start; }
    .group-marker { display: grid; place-items: center; width: 36px; height: 36px; border: 1px solid var(--sea-dim); border-radius: 50%; color: var(--sea); font: 900 15px/1 var(--display); }
    .micro-label { display: block; color: var(--muted); font: 800 8px/1 var(--display); letter-spacing: .18em; text-transform: uppercase; }
    .dm-name { display: block; margin-top: 7px; overflow-wrap: anywhere; font: 900 17px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; }
    .capacity { color: var(--signal); font: 900 17px/1 var(--display); }
    .group-context { min-height: 28px; margin: 18px 0 10px 54px; color: var(--sea); font: 800 10px/1.25 var(--display); letter-spacing: .07em; text-transform: uppercase; }
    .diver-list { margin: 0; padding: 0; list-style: none; }
    .diver-row { display: grid; grid-template-columns: 24px 1fr auto; gap: 10px; min-height: 37px; align-items: center; border-top: 1px solid var(--line); }
    .diver-index { color: var(--muted); font: 800 9px/1 var(--display); }
    .diver-name { overflow-wrap: anywhere; font: 700 11px/1.2 var(--display); letter-spacing: .04em; text-transform: uppercase; }
    .diver-note { color: var(--muted); font: 700 10px/1 var(--display); }
    .board-footnote { display: flex; justify-content: space-between; gap: 20px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line-strong); color: var(--muted); font: 800 9px/1.3 var(--display); letter-spacing: .14em; text-transform: uppercase; }
    .board-footnote strong { color: var(--sea); }

    .is-editing .slot-card, .is-editing .group-card { border-color: rgba(242, 201, 85, .34); }
    .edit-field {
      width: 100%;
      min-width: 0;
      border: 0;
      border-bottom: 1px solid rgba(242, 201, 85, .54);
      border-radius: 0;
      padding: 3px 2px 4px;
      color: var(--text);
      background: rgba(242, 201, 85, .07);
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
    }
    .edit-field:hover { background: rgba(242, 201, 85, .12); }
    .edit-inline { display: inline-block; width: auto; max-width: 100%; }
    .edit-number { width: 3.4em; text-align: left; }
    .edit-date { min-height: 1.2em; color: inherit; }
    .edit-weekday { opacity: .85; cursor: default; }
    .date-lockup .edit-field { text-align: right; }
    .is-editing .slot-card { cursor: default; }
    #edit-toggle[aria-pressed="true"] { border-color: var(--signal); color: #071014; background: var(--signal); }
    #status-message[data-kind="error"] { color: var(--danger); }

    .utility-bar { display: flex; align-items: center; gap: 6px; min-height: 50px; border-top: 1px solid var(--line); }
    .utility-bar button, .import-button { display: inline-grid; place-items: center; min-height: 34px; padding: 0 10px; font-size: 9px; }
    #status-message { margin: 0 0 0 auto; color: var(--sea); font: 700 10px/1.2 var(--display); letter-spacing: .08em; }

    .view-enter { animation: boardEnter .52s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes boardEnter { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    @media (max-width: 1040px) {
      .topbar { grid-template-columns: auto 1fr; }
      .view-nav { grid-column: 1 / -1; grid-row: 2; justify-content: stretch; overflow-x: auto; }
      .view-nav button { flex: 1 0 auto; }
      .overview-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .slot-card:nth-child(2) { border-right: 0; }
      .slot-card:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
      .session-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .app-shell { padding: 10px 12px 18px; }
      .topbar { top: 6px; gap: 9px; padding: 9px; border-radius: 11px; }
      .brand { padding-left: 4px; }
      .brand span { display: none; }
      #edit-toggle { justify-self: end; min-height: 34px; padding: 0 10px; }
      .view-nav { justify-content: start; margin: 0 -2px; padding: 2px; }
      .view-nav button { flex: 0 0 auto; min-height: 34px; padding: 0 11px; }
      #board { padding: 34px 0 22px; }
      .board-heading { display: block; margin-bottom: 28px; }
      .board-title { font-size: clamp(45px, 17vw, 72px); }
      .date-lockup { margin-top: 24px; padding: 14px 0 0; border-top: 1px solid var(--line); border-left: 0; text-align: left; }
      .overview-grid { grid-template-columns: 1fr; border: 0; gap: 8px; }
      .slot-card { min-height: 210px; border: 1px solid var(--line) !important; border-radius: 3px; }
      .slot-time { font-size: 58px; }
      .session-meta { flex-wrap: wrap; gap: 8px 14px; }
      .session-grid { grid-template-columns: 1fr; }
      .group-card { min-height: 224px; }
      .board-footnote { display: block; line-height: 1.6; }
      .board-footnote strong { display: block; margin-top: 8px; }
      .utility-bar { flex-wrap: wrap; padding-top: 10px; }
      #status-message { width: 100%; margin: 4px 0 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }

    /* Original Google Slides visual system */
    :root {
      --paper: #f2eee5;
      --paper-card: #fffefd;
      --ink-original: #123b4b;
      --ink-soft-original: #416875;
      --aqua: #55c9c1;
      --aqua-dark: #179b97;
      --aqua-pale: #e8f3f3;
      --red: #d94b49;
      --line-original: #b8d9df;
      --line-strong-original: #55c9c1;
      --ui-bg: #ece8df;
      --original-display: "Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
      --original-mono: "Courier New", ui-monospace, monospace;
    }

    html { background: var(--ui-bg); }
    body { color: var(--ink-original); background: var(--ui-bg); }

    .app-controls {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 7px;
      width: min(100%, 1600px);
      min-height: 54px;
      margin: 0 auto;
      padding: 9px 16px;
      border: 0;
      background: transparent;
    }
    .app-controls .control-brand {
      flex: 0 0 auto;
      margin-right: 10px;
      color: var(--ink-soft-original);
      font: 800 11px/1 var(--original-display);
      letter-spacing: .18em;
      white-space: nowrap;
    }
    .app-controls .view-nav {
      display: flex;
      flex: 1 1 auto;
      justify-content: flex-start;
      gap: 5px;
      min-width: 0;
    }
    .app-controls .view-nav button,
    .app-controls > button,
    .app-controls .import-button {
      display: inline-grid;
      place-items: center;
      min-height: 34px;
      border: 1px solid rgba(18, 59, 75, .2);
      border-radius: 4px;
      padding: 0 11px;
      color: var(--ink-original);
      background: #faf8f2;
      cursor: pointer;
      font: 750 10px/1 var(--original-display);
      letter-spacing: .06em;
      text-transform: uppercase;
      box-shadow: none;
      transition: color .15s ease, background .15s ease, border-color .15s ease;
    }
    .app-controls .view-nav button:hover,
    .app-controls > button:hover,
    .app-controls .import-button:hover { color: var(--ink-original); border-color: var(--aqua-dark); background: #fff; transform: none; }
    .app-controls .view-nav button[aria-current="page"] { color: #fff; border-color: var(--ink-original); background: var(--ink-original); }
    .app-controls #edit-toggle[aria-pressed="true"] { color: #fff; border-color: var(--aqua-dark); background: var(--aqua-dark); }
    .app-controls #status-message { flex: 0 1 260px; margin: 0 0 0 auto; color: var(--aqua-dark); font: 700 10px/1.25 var(--original-display); letter-spacing: .03em; text-align: right; }
    .app-controls #status-message[data-kind="error"] { color: var(--red); }
    .playback-controls { display: flex; align-items: center; gap: 6px; }
    .playback-controls button,
    .playback-controls select,
    .playback-controls input {
      min-height: 32px;
      border: 1px solid var(--line-original);
      border-radius: 2px;
      color: var(--ink-original);
      background: rgba(255, 255, 255, .66);
      font: 700 10px/1 var(--original-display);
      letter-spacing: .04em;
    }
    .playback-controls button { padding: 0 10px; cursor: pointer; }
    .playback-controls button:hover { border-color: var(--aqua-dark); background: #fff; }
    .playback-controls button[aria-pressed="true"] { color: #fff; border-color: var(--aqua-dark); background: var(--aqua-dark); }
    .interval-control, .custom-interval-control { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-original); font: 700 10px/1 var(--original-display); }
    .custom-interval-control[hidden] { display: none; }
    .interval-control select { padding: 0 24px 0 8px; }
    .custom-interval-control input { width: 64px; padding: 0 6px; }

    .slide-stage { width: min(100%, 1600px); margin: 0 auto; padding: 0 16px 16px; }
    #board.slide-canvas {
      position: relative;
      min-height: 0;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      padding: clamp(24px, 2.5vw, 42px) clamp(30px, 3.2vw, 54px);
      color: var(--ink-original);
      background: var(--paper);
      box-shadow: 0 14px 42px rgba(38, 58, 59, .16);
      isolation: isolate;
    }
    #board.slide-canvas::before,
    #board.slide-canvas::after {
      content: "";
      position: absolute;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
    }
    #board.slide-canvas::before { top: -160px; right: -100px; width: 390px; height: 390px; background: #dff2ef; }
    #board.slide-canvas::after { bottom: -210px; left: -160px; width: 500px; height: 390px; background: rgba(226, 219, 204, .48); }

    .original-overview,
    .original-session { display: flex; flex-direction: column; width: 100%; height: 100%; animation: originalEnter .28s ease both; }
    @keyframes originalEnter { from { opacity: 0; } to { opacity: 1; } }

    .overview-brand-row {
      display: grid;
      grid-template-columns: minmax(300px, 1fr) minmax(330px, .82fr);
      align-items: start;
      gap: 36px;
      min-height: 185px;
    }
    .udive-logo { display: flex; min-width: 0; align-items: flex-start; }
    .udive-logo-image {
      display: block;
      width: min(100%, 720px);
      height: auto;
      max-height: 175px;
      object-fit: contain;
      object-position: left top;
    }

    .deck-date-card {
      position: relative;
      justify-self: end;
      width: min(100%, 485px);
      margin-top: 18px;
      padding: 28px 34px 24px;
      border: 2px solid var(--line-original);
      border-radius: 14px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 6px 10px rgba(32, 59, 65, .22);
    }
    .deck-date-card .date-label { display: block; color: var(--ink-soft-original); font: 400 15px/1 var(--original-mono); }
    .deck-date-card strong { display: block; margin-top: 18px; color: var(--aqua-dark); font: 850 clamp(34px, 3.2vw, 54px)/1 var(--original-display); letter-spacing: .04em; }
    .deck-date-card small { display: block; margin-top: 24px; color: var(--ink-soft-original); font: 500 19px/1 var(--original-display); }

    .deck-title {
      margin: 2px 6px 18px;
      color: var(--ink-soft-original);
      font: 500 clamp(15px, 1.45vw, 24px)/1 var(--original-mono);
      letter-spacing: .21em;
      text-transform: uppercase;
    }
    .schedule-grid { display: grid; flex: 1 1 auto; grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 10px; min-height: 0; }
    .schedule-column {
      display: grid;
      grid-template-columns: minmax(150px, 1.12fr) minmax(170px, .95fr) minmax(90px, .7fr) minmax(80px, .7fr) minmax(210px, 1.7fr);
      align-items: center;
      gap: clamp(18px, 3vw, 54px);
      min-width: 0;
      padding: 11px 34px;
      border: 2px solid var(--line-original);
      border-radius: 10px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 6px 9px rgba(37, 60, 63, .22);
    }
    .schedule-column[data-live="true"] { border-width: 4px; border-color: var(--line-strong-original); }
    .schedule-time { margin: 0; color: var(--ink-original); font: 650 clamp(31px, 3.45vw, 54px)/1 var(--original-mono); letter-spacing: .05em; }
    .schedule-status {
      display: grid;
      place-items: center;
      min-height: 47px;
      margin: 0;
      border: 2px solid var(--line-original);
      border-radius: 999px;
      color: var(--ink-soft-original);
      background: var(--aqua-pale);
      font: 750 clamp(13px, 1.15vw, 18px)/1 var(--original-mono);
      text-align: center;
    }
    .schedule-column[data-live="true"] .schedule-status { border-color: var(--aqua); color: var(--ink-original); background: var(--aqua); }
    .schedule-metric span,
    .schedule-site span { display: block; color: var(--ink-soft-original); font: 400 13px/1 var(--original-mono); letter-spacing: .05em; }
    .schedule-metric strong { display: block; margin-top: 14px; color: var(--aqua-dark); font: 800 clamp(20px, 2vw, 31px)/1 var(--original-display); }
    .schedule-site strong { display: block; margin-top: 14px; overflow-wrap: anywhere; color: var(--ink-original); font: 750 clamp(19px, 1.75vw, 29px)/1 var(--original-display); }

    .session-header {
      display: grid;
      grid-template-columns: minmax(240px, .78fr) minmax(390px, 1.4fr) minmax(190px, .65fr);
      align-items: center;
      gap: 26px;
      min-height: 105px;
      border-bottom: 3px solid #d3e6e7;
    }
    .session-time { margin: 0; font: 700 clamp(55px, 6.2vw, 96px)/.9 var(--original-mono); letter-spacing: .04em; }
    .session-summary-line { display: flex; align-items: center; gap: 14px; min-width: 0; color: var(--aqua-dark); font: 500 clamp(16px, 1.55vw, 24px)/1 var(--original-mono); }
    .session-status {
      display: inline-grid;
      flex: 0 0 min(245px, 45%);
      place-items: center;
      min-height: 52px;
      border-radius: 999px;
      color: var(--ink-original);
      background: var(--aqua);
      font: 750 clamp(13px, 1.2vw, 19px)/1 var(--original-mono);
    }
    .session-summary { overflow-wrap: anywhere; }
    .session-date { justify-self: end; color: var(--ink-soft-original); font: 750 clamp(19px, 2vw, 31px)/1 var(--original-display); }

    .group-grid { display: grid; flex: 1 1 auto; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 10px 14px; min-height: 0; padding: 18px 0 8px; }
    .group-cell {
      display: grid;
      grid-template-columns: minmax(118px, .92fr) minmax(132px, 1.18fr);
      gap: 10px 12px;
      min-width: 0;
      min-height: 0;
      align-items: stretch;
      padding: 12px 12px 10px;
      border: 2px solid var(--line-original);
      border-radius: 11px;
      background: rgba(255, 255, 255, .95);
      box-shadow: 0 6px 8px rgba(39, 62, 64, .22);
    }
    .group-dm-pane {
      display: flex;
      min-width: 0;

    .group-cell[data-open="true"] .group-marker { color: var(--ink-soft-original); background: var(--aqua-pale); }
    .dm-block .micro-label { display: block; color: var(--ink-soft-original); font: 400 11px/1 var(--original-mono); }
    .dm-name { display: block; margin-top: 6px; overflow-wrap: anywhere; color: var(--ink-original); font: 750 clamp(14px, 1.25vw, 20px)/1.05 var(--original-display); text-transform: none; }
    .group-cell[data-open="true"] .dm-name { color: var(--ink-soft-original); font-style: italic; font-weight: 450; }
    .capacity { color: var(--red); font: 650 clamp(14px, 1.2vw, 18px)/1 var(--original-mono); }
    .group-cell[data-open="true"] .capacity { color: var(--ink-soft-original); }
    .group-context { min-height: 0; margin: 0; color: var(--aqua-dark); font: 400 clamp(11px, .95vw, 14px)/1.25 var(--original-mono); text-transform: none; }
    .diver-list { display: grid; gap: 4px; flex: 1 1 auto; margin: 0; padding: 0; list-style: none; align-content: start; }
    .diver-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) 14px; gap: 6px; min-height: 30px; align-items: center; padding: 0 7px; border: 2px solid #d4e7e8; border-radius: 7px; background: var(--aqua-pale); }
    .diver-index { color: var(--aqua-dark); font: 600 12px/1 var(--original-mono); }
    .diver-name { overflow-wrap: anywhere; color: var(--ink-original); font: 650 clamp(12px, 1.05vw, 16px)/1.1 var(--original-display); text-transform: none; }
    .group-cell[data-open="true"] .diver-name { color: var(--ink-soft-original); font-style: italic; font-weight: 450; }
    .diver-note { color: var(--ink-soft-original); font: 500 11px/1 var(--original-mono); text-align: right; }
    .group-copy-row { display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 4px; margin-top: auto; }
    .copy-names-btn,
    .paste-names-btn {
      min-height: 28px;
      border: 1.5px solid var(--line-original);
      border-radius: 999px;
      padding: 0 12px;
      color: var(--aqua-dark);
      background: var(--aqua-pale);
      cursor: pointer;
      font: 700 11px/1 var(--original-mono);
      letter-spacing: .08em;
      text-transform: uppercase;
      transition: background .15s ease, border-color .15s ease, color .15s ease;
    }
    .copy-names-btn:hover,
    .paste-names-btn:hover { border-color: var(--aqua); color: var(--ink-original); background: var(--aqua); }
    .copy-names-btn:active,
    .paste-names-btn:active { transform: translateY(1px); }
    .copy-names-btn[data-copied="true"],
    .paste-names-btn[data-pasted="true"] { border-color: var(--aqua); color: var(--ink-original); background: var(--aqua); }

    .slide-footer { display: flex; justify-content: space-between; gap: 18px; flex: 0 0 auto; margin-top: 10px; padding-top: 9px; border-top: 3px solid #d3e6e7; color: var(--ink-soft-original); font: 400 clamp(11px, 1vw, 16px)/1.2 var(--original-mono); letter-spacing: .03em; }
    .original-overview .slide-footer { border-top: 0; }
    .slide-footer strong { color: var(--ink-soft-original); font-weight: 400; white-space: nowrap; }

    .is-editing .schedule-column,
    .is-editing .group-cell { border-color: var(--red); }

      min-width: 0;
      border: 0;
      border-bottom: 2px dashed rgba(217, 75, 73, .55);

      background: rgba(217, 75, 73, .07);
      font: inherit;
      letter-spacing: inherit;
      text-align: inherit;
      text-transform: inherit;

    .slide-canvas .edit-inline { display: inline-block; width: auto; max-width: 100%; }
    .slide-canvas .edit-number { width: 3em; }

    @media (max-width: 1400px) {

      .session-header { min-height: 82px; }
      .session-time { font-size: clamp(48px, 5.4vw, 76px); }
      .session-status { min-height: 44px; }
      .group-grid { gap: 8px 10px; padding: 12px 0 6px; }

      .diver-list { gap: 3px; }
      .diver-row { min-height: 28px; padding: 0 6px; }
      .diver-name { font-size: clamp(11px, 1vw, 15px); }
      .slide-footer { margin-top: 6px; padding-top: 6px; }
    }

    @media (max-width: 1120px) {
      .overview-brand-row { min-height: 145px; }

      .group-cell { padding: 10px; grid-template-columns: minmax(110px, .95fr) minmax(120px, 1.15fr); }
      .group-marker { width: 40px; height: 40px; font-size: 20px; }
      .group-top { grid-template-columns: 40px minmax(0, 1fr); gap: 7px; }
      .group-grid { gap: 8px 10px; padding-top: 14px; }

    @media (max-width: 900px) {
      .app-controls { flex-wrap: wrap; }
      .app-controls .view-nav { order: 2; flex-basis: 100%; overflow-x: auto; }
      #board.slide-canvas { aspect-ratio: auto; min-height: calc(100vh - 110px); overflow: visible; }
      .overview-brand-row { grid-template-columns: 1fr 1fr; }
      .schedule-grid { grid-template-rows: none; }
      .schedule-column { grid-template-columns: 1fr 1fr 1fr 1fr; }
      .schedule-site { grid-column: 1 / -1; }
      .group-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; }
      .group-cell { grid-template-columns: minmax(100px, .9fr) minmax(120px, 1.2fr); }
      .session-header { grid-template-columns: 1fr 1.5fr; }
      .session-date { grid-column: 1 / -1; justify-self: end; }
    }

    @media (max-width: 760px) {
      .playback-controls { order: 3; flex: 1 0 100%; flex-wrap: wrap; }
    }

    @media (max-width: 620px) {
      .app-controls { padding: 8px 10px; }
      .app-controls .control-brand { display: none; }
      .app-controls .view-nav { flex-wrap: nowrap; }
      .app-controls .view-nav button { flex: 0 0 auto; }
      .app-controls #status-message { flex-basis: 100%; text-align: left; }
      .slide-stage { padding: 0; overflow-x: clip; }
      #board.slide-canvas { padding: 24px 16px; overflow-x: clip; overflow-y: visible; box-shadow: none; }
      .overview-brand-row { grid-template-columns: 1fr; gap: 12px; }
      .udive-logo-image { width: min(100%, 520px); max-height: none; }
      .deck-date-card { justify-self: stretch; width: 100%; margin-top: 0; padding: 18px 20px; }
      .deck-date-card strong { font-size: 32px; }
      .deck-date-card small { margin-top: 12px; }
      .deck-title { margin-top: 22px; font-size: 12px; line-height: 1.35; }
      .schedule-column { grid-template-columns: 1fr 1fr; gap: 15px; padding: 18px; }
      .schedule-time { font-size: 37px; }
      .schedule-status { min-height: 40px; }
      .schedule-site { grid-column: 1 / -1; }
      .session-header { grid-template-columns: 1fr; gap: 14px; padding-bottom: 20px; }
      .session-time { font-size: 58px; }
      .session-summary-line { display: grid; grid-template-columns: 1fr; }
      .session-status { min-height: 42px; }
      .session-date { grid-column: auto; justify-self: start; }
      .group-grid { grid-template-columns: 1fr; grid-template-rows: none; padding-top: 18px; }
      .group-cell { min-height: 0; grid-template-columns: minmax(110px, .9fr) minmax(140px, 1.2fr); }
      .slide-footer { display: block; line-height: 1.5; }
      .slide-footer strong { display: block; margin-top: 8px; }
    }

    const STORAGE_KEY = "tulamben-dive-board-v3";
    const PLAYBACK_STORAGE_KEY = "tulamben-dive-board-playback-v1";
    const board = document.querySelector("#board");
    const navButtons = [...document.querySelectorAll("[data-view]")];
    const editToggle = document.querySelector("#edit-toggle");
    const statusMessage = document.querySelector("#status-message");
    const autoplayToggle = document.querySelector("#autoplay-toggle");
    const loopToggle = document.querySelector("#loop-toggle");
    const intervalSelect = document.querySelector("#interval-select");
    const customIntervalControl = document.querySelector(".custom-interval-control");
    const customInterval = document.querySelector("#custom-interval");
    const requiredSessionIds = ["slot-0900", "slot-1100", "slot-1400", "slot-1830"];
    const VIEWS = ["overview", ...requiredSessionIds];

    function validateData(value) {
      return Boolean(
        value && value.date && typeof value.date.display === "string"
        && Array.isArray(value.overview) && value.overview.length === 4
        && value.sessions && requiredSessionIds.every(id =>
          value.sessions[id] && Array.isArray(value.sessions[id].groups)
          && value.sessions[id].groups.length === 9
        )
      );
    }

    function normalizeGroupCount(data) {
      const emptyGroup = () => structuredClone({
        marker: "?",
        dm: "unassigned",
        capacity: "0/3",
        context: "—",
        divers: [
          { name: "open", note: "" },
          { name: "open", note: "" },
          { name: "open", note: "" }
        ]
      });
      for (const id of requiredSessionIds) {
        const session = data?.sessions?.[id];
        if (!session || !Array.isArray(session.groups)) continue;
        while (session.groups.length < 9) session.groups.push(emptyGroup());
        session.groups = session.groups.slice(0, 9);
      }
      return data;
    }

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return structuredClone(BOARD_DATA);
        const parsed = normalizeGroupCount(JSON.parse(saved));
        return validateData(parsed) ? parsed : structuredClone(BOARD_DATA);
      } catch (error) {
        return structuredClone(BOARD_DATA);
      }
    }

    function validInterval(value) {
      const seconds = Number(value);
      return Number.isInteger(seconds) && seconds >= 1 && seconds <= 3600;
    }

    function loadPlaybackPreferences() {
      try {
        const parsed = JSON.parse(localStorage.getItem(PLAYBACK_STORAGE_KEY) || "null");
        return {
          loop: Boolean(parsed?.loop),
          intervalSeconds: validInterval(parsed?.intervalSeconds) ? Number(parsed.intervalSeconds) : 5
        };
      } catch (error) {
        return { loop: false, intervalSeconds: 5 };
      }
    }

    const playbackPreferences = loadPlaybackPreferences();
    const state = {
      activeView: "overview",
      editing: false,
      autoplay: false,
      autoplayTimer: null,
      loop: playbackPreferences.loop,
      intervalSeconds: playbackPreferences.intervalSeconds,
      data: loadData()
    };

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>'"]/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[character]);
    }

    const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const MONTH_INDEX = Object.fromEntries(MONTHS.map((month, index) => [month, index]));

    function parseBoardDate(display) {
      const match = String(display ?? "").trim().match(/^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})$/);
      if (!match) return null;
      const day = Number(match[1]);
      const month = MONTH_INDEX[match[2].toUpperCase()];
      const year = Number(match[3]);
      if (month === undefined) return null;
      const date = new Date(year, month, day);
      if (date.getFullYear() !== year || date.getMonth() !== month || date.getDate() !== day) return null;
      return date;
    }

    function formatBoardDate(date) {
      return `${date.getDate()} ${MONTHS[date.getMonth()]} ${date.getFullYear()}`;
    }

    function formatWeekday(date) {
      return date.toLocaleDateString("en-US", { weekday: "long" });
    }

    function toDateInputValue(display) {
      const parsed = parseBoardDate(display);
      if (!parsed) return "";
      const month = String(parsed.getMonth() + 1).padStart(2, "0");
      const day = String(parsed.getDate()).padStart(2, "0");
      return `${parsed.getFullYear()}-${month}-${day}`;
    }

    function syncDateDerivedFields(displayValue) {
      const parsed = parseBoardDate(displayValue);
      if (!parsed) return false;
      const weekday = formatWeekday(parsed);
      state.data.date.display = formatBoardDate(parsed);
      state.data.date.weekday = weekday;
      board.querySelectorAll('input[data-path="date.display"]').forEach(input => {
        if (input.dataset.kind === "date") input.value = toDateInputValue(state.data.date.display);
        else input.value = state.data.date.display;
      });
      board.querySelectorAll('input[data-path="date.weekday"]').forEach(input => {
        input.value = weekday;
      });
      board.querySelectorAll("[data-date-display]").forEach(node => {
        node.textContent = state.data.date.display;
      });
      board.querySelectorAll("[data-date-weekday]").forEach(node => {
        node.textContent = weekday;
      });
      return true;
    }

    function editableField(path, value, label, options = {}) {
      if (!state.editing) {
        if (path === "date.display") return `<span data-date-display>${escapeHTML(value)}</span>`;
        if (path === "date.weekday") return `<span data-date-weekday>${escapeHTML(value)}</span>`;
        return escapeHTML(value);
      }
      if (path === "date.display") {
        const className = options.className ? ` ${options.className}` : "";
        return `<input class="edit-field edit-date${className}" type="date" data-path="date.display" data-kind="date" aria-label="${escapeHTML(label)}" value="${escapeHTML(toDateInputValue(value))}">`;
      }
      if (path === "date.weekday") {
        return `<input class="edit-field edit-weekday" type="text" data-path="date.weekday" data-kind="text" readonly tabindex="-1" aria-label="${escapeHTML(label)} (auto from date)" value="${escapeHTML(value)}">`;
      }
      const type = options.type || "text";
      const inputMode = type === "number" ? " inputmode=\"numeric\"" : "";
      const className = options.className ? ` ${options.className}` : "";
      return `<input class="edit-field${className}" type="${type}"${inputMode} data-path="${escapeHTML(path)}" data-kind="${type}" aria-label="${escapeHTML(label)}" value="${escapeHTML(value)}">`;
    }

    function renderOverview(data) {

          <h2 class="schedule-time">${editableField(`overview.${index}.time`, item.time, `Time slot ${index + 1}`, { className: "edit-inline" })}</h2>
          <p class="schedule-status">${editableField(`overview.${index}.status`, item.status, `Status for ${item.time}`)}</p>
          <div class="schedule-metric"><span>DM GROUPS</span><strong data-auto-metric="overview.${index}.dmGroups">${escapeHTML(item.dmGroups)}</strong></div>
          <div class="schedule-metric"><span>DIVERS</span><strong data-auto-metric="overview.${index}.divers">${escapeHTML(item.divers)}</strong></div>
          <div class="schedule-site"><span>SITE</span><strong>${editableField(`overview.${index}.site`, item.site, `Dive site for ${item.time}`)}</strong></div>
        </section>`).join("");

    function renderSession(session, data) {
      const sessionPath = `sessions.${state.activeView}`;
      const groups = session.groups.map((group, groupIndex) => {
        const divers = group.divers.map((diver, diverIndex) => `
          <li class="diver-row">
            <span class="diver-index">${diverIndex + 1}</span>
            <span class="diver-name">${editableField(`${sessionPath}.groups.${groupIndex}.divers.${diverIndex}.name`, diver.name, `Group ${groupIndex + 1} diver ${diverIndex + 1}`)}</span>
            <span class="diver-note">${editableField(`${sessionPath}.groups.${groupIndex}.divers.${diverIndex}.note`, diver.note, `Note for group ${groupIndex + 1} diver ${diverIndex + 1}`, { className: "edit-inline" })}</span>
          </li>`).join("");
        return `
          <section class="group-cell" data-open="${group.dm === "unassigned"}" aria-label="Group ${groupIndex + 1}">
            <div class="group-dm-pane">
              <div class="group-top">
                <span class="group-marker">${editableField(`${sessionPath}.groups.${groupIndex}.marker`, group.marker, `Group ${groupIndex + 1} marker`, { className: "edit-inline" })}</span>
                <span class="dm-block"><span class="micro-label">DM</span><strong class="dm-name">${editableField(`${sessionPath}.groups.${groupIndex}.dm`, group.dm, `Group ${groupIndex + 1} dive master`)}</strong></span>
              </div>
              <span class="capacity" data-auto-capacity="${groupIndex}">${escapeHTML(group.capacity)}</span>
              <p class="group-context">${editableField(`${sessionPath}.groups.${groupIndex}.context`, group.context, `Group ${groupIndex + 1} site and context`)}</p>
              ${state.editing ? `<div class="group-copy-row">
                <button type="button" class="paste-names-btn" data-paste-group="${groupIndex}" aria-label="Paste guest names into group ${groupIndex + 1}">Paste names</button>
                <button type="button" class="copy-names-btn" data-copy-group="${groupIndex}" aria-label="Copy 3 guest names from group ${groupIndex + 1}">Copy names</button>
              </div>` : ""}
            </div>
            <div class="group-guest-pane">
              <ol class="diver-list">${divers}</ol>
            </div>
          </section>`;
      }).join("");

      return `
        <article class="original-session">
          <header class="session-header">
            <h1 class="session-time">${editableField(`${sessionPath}.sourceTime`, session.sourceTime, "Session time", { className: "edit-inline" })}</h1>
            <div class="session-summary-line">
              <span class="session-status">${editableField(`${sessionPath}.status`, session.status, "Session status")}</span>
              <span class="session-summary" data-auto-summary>${escapeHTML(session.summary)}</span>
            </div>
            <div class="session-date">${editableField("date.display", data.date.display, "Board date")}</div>
          </header>
          <div class="group-grid">${groups}</div>
          <footer class="slide-footer"><span>${editableField("safety", data.safety, "Safety note")}</span><strong>UDIVEBALI TULAMBEN</strong></footer>
        </article>`;
    }

    function syncNavigation() {
      navButtons.forEach(button => {
        const current = button.dataset.view === state.activeView;
        if (current) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });
    }

    function syncPlaybackControls() {
      autoplayToggle.setAttribute("aria-pressed", String(state.autoplay));
      autoplayToggle.textContent = state.autoplay ? "Autoplay: Playing" : "Autoplay: Off";
      loopToggle.setAttribute("aria-pressed", String(state.loop));
      loopToggle.textContent = state.loop ? "Loop: On" : "Loop: Off";
      const preset = [5, 10, 15, 30, 60].includes(state.intervalSeconds);
      intervalSelect.value = preset ? String(state.intervalSeconds) : "custom";
      customIntervalControl.hidden = preset;
      customInterval.value = String(state.intervalSeconds);
    }

    function setActiveView(view, { restartTimer = true } = {}) {
      if (!VIEWS.includes(view)) return;
      state.activeView = view;
      renderApp();
      if (restartTimer && state.autoplay) scheduleNextView();
    }

    function setAtPath(target, path, value) {
      const keys = path.split(".");
      const finalKey = keys.pop();
      const parent = keys.reduce((current, key) => current[key], target);
      parent[finalKey] = value;
    }

    let statusTimer;
    function showStatus(message, kind = "ok") {
      clearTimeout(statusTimer);
      statusMessage.textContent = message;
      statusMessage.dataset.kind = kind;
      statusTimer = setTimeout(() => { statusMessage.textContent = ""; }, 3600);
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
        showStatus("Changes saved on this device");
        return true;
      } catch (error) {
        showStatus("Changes are active, but browser storage is unavailable", "error");
        return false;
      }
    }

    function savePlaybackPreferences() {
      try {
        localStorage.setItem(PLAYBACK_STORAGE_KEY, JSON.stringify({
          loop: state.loop,
          intervalSeconds: state.intervalSeconds
        }));
      } catch (error) {
        showStatus("Playback settings could not be saved", "error");
      }
    }

    function clearAutoplayTimer() {
      if (state.autoplayTimer !== null) clearTimeout(state.autoplayTimer);
      state.autoplayTimer = null;
    }

    function scheduleNextView() {
      clearAutoplayTimer();
      if (!state.autoplay || state.editing) return;
      state.autoplayTimer = setTimeout(() => {
        const currentIndex = VIEWS.indexOf(state.activeView);
        const atLastView = currentIndex === VIEWS.length - 1;
        if (atLastView && !state.loop) {
          stopAutoplay("Autoplay finished");
          return;
        }
        setActiveView(VIEWS[(currentIndex + 1) % VIEWS.length], { restartTimer: true });
      }, state.intervalSeconds * 1000);
    }

    function startAutoplay() {
      if (state.editing) return;
      state.autoplay = true;
      syncPlaybackControls();
      scheduleNextView();
      showStatus(`Autoplay started · ${state.intervalSeconds} sec`);
    }

    function stopAutoplay(message = "Autoplay stopped") {
      state.autoplay = false;
      clearAutoplayTimer();
      syncPlaybackControls();
      showStatus(message);
    }

    function bindEditableFields() {
      board.querySelectorAll("input[data-path]").forEach(input => input.addEventListener("input", () => {
        const path = input.dataset.path;
        let value;
        if (input.dataset.kind === "number") value = Number(input.value);
        else if (input.dataset.kind === "date") {
          if (!input.value) return;
          const parsed = new Date(`${input.value}T00:00:00`);
          if (Number.isNaN(parsed.getTime())) return;
          value = formatBoardDate(parsed);
        } else value = input.value;

        setAtPath(state.data, path, value);

        board.querySelectorAll(`input[data-path="${CSS.escape(path)}"]`).forEach(peer => {
          if (peer === input) return;
          if (peer.dataset.kind === "date") peer.value = toDateInputValue(String(value));
          else if (String(peer.value) !== String(value)) peer.value = value;
        });

        if (path === "date.display") syncDateDerivedFields(String(value));
        if (/\.groups\.\d+\.dm$/.test(path) || /\.divers\.\d+\.name$/.test(path)) {
          updateLiveDerivedDisplays();
        }

        saveState();
      }));
    }

    function isPlaceholderName(name) {
      const normalized = String(name ?? "").trim().toLowerCase();
      return !normalized || normalized === "-" || normalized === "—" || normalized === "open";
    }

    function isPlaceholderDm(dm) {
      const normalized = String(dm ?? "").trim().toLowerCase();
      return !normalized || normalized === "-" || normalized === "—" || normalized === "unassigned" || normalized === "?";
    }

    function countGroupDivers(group) {
      return (group?.divers || []).filter(diver => !isPlaceholderName(diver?.name)).length;
    }

    function capacityMax(capacity, fallback = 3) {
      const match = String(capacity ?? "").trim().match(/^(?:\d+|-)\s*\/\s*(\d+)$/);
      return match ? Number(match[1]) : fallback;
    }

    function computeSessionTotals(session) {
      let divers = 0;
      let dmGroups = 0;
      for (const group of session?.groups || []) {
        divers += countGroupDivers(group);
        if (!isPlaceholderDm(group.dm)) dmGroups += 1;
      }
      return { dmGroups, divers };
    }

    function formatSessionSummary(dmGroups, divers) {
      return `${dmGroups} DM · ${divers} DIVERS`;
    }

    function syncDerivedCounts(data = state.data) {
      if (!data?.overview || !data?.sessions) return data;
      for (const item of data.overview) {
        const session = data.sessions[item.id];
        if (!session) continue;
        for (const group of session.groups || []) {
          group.capacity = `${countGroupDivers(group)}/${capacityMax(group.capacity)}`;
        }
        const totals = computeSessionTotals(session);
        item.dmGroups = totals.dmGroups;
        item.divers = totals.divers;
        session.summary = formatSessionSummary(totals.dmGroups, totals.divers);
      }
      return data;
    }

    function updateLiveDerivedDisplays() {
      syncDerivedCounts();
      if (state.activeView === "overview") {
        state.data.overview.forEach((item, index) => {
          const dmNode = board.querySelector(`[data-auto-metric="overview.${index}.dmGroups"]`);
          const diversNode = board.querySelector(`[data-auto-metric="overview.${index}.divers"]`);
          if (dmNode) dmNode.textContent = String(item.dmGroups);
          if (diversNode) diversNode.textContent = String(item.divers);
        });
        return;
      }
      const session = state.data.sessions[state.activeView];
      if (!session) return;
      const summaryNode = board.querySelector("[data-auto-summary]");
      if (summaryNode) summaryNode.textContent = session.summary;
      session.groups.forEach((group, groupIndex) => {
        const capacityNode = board.querySelector(`[data-auto-capacity="${groupIndex}"]`);
        if (capacityNode) capacityNode.textContent = group.capacity;
      });
    }

    function groupGuestNames(group) {
      return (group?.divers || []).slice(0, 3).map(diver => String(diver?.name ?? "").trim());
    }

    function sortGuestNames(names) {
      return [...names].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base", numeric: true }));
    }

    function parseNameList(text) {
      return String(text ?? "")
        .split(/[\n\r,;|]+/)
        .map(name => name.trim())
        .filter(name => !isPlaceholderName(name));
    }

    function applySortedNamesToGroup(groupIndex, rawNames) {
      const group = state.data.sessions[state.activeView]?.groups?.[groupIndex];
      if (!group) return 0;
      const sorted = sortGuestNames(parseNameList(Array.isArray(rawNames) ? rawNames.join("\n") : rawNames)).slice(0, 3);
      for (let index = 0; index < 3; index += 1) {
        if (!group.divers[index]) group.divers[index] = { name: "-", note: "-" };
        group.divers[index].name = sorted[index] || "-";
      }
      syncDerivedCounts();
      return sorted.length;
    }

    async function copyText(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.append(area);
      area.select();
      const ok = document.execCommand("copy");
      area.remove();
      if (!ok) throw new Error("Copy failed");
    }

    async function readClipboardText() {
      if (navigator.clipboard?.readText) return navigator.clipboard.readText();
      throw new Error("Clipboard read unavailable");
    }

    function flashActionButton(button, key, idleLabel, activeLabel) {
      button.dataset[key] = "true";
      button.textContent = activeLabel;
      setTimeout(() => {
        button.dataset[key] = "false";
        button.textContent = idleLabel;
      }, 1600);
    }

    function bindCopyNameButtons() {
      board.querySelectorAll("[data-copy-group]").forEach(button => {
        button.addEventListener("click", async event => {
          event.preventDefault();
          event.stopPropagation();
          const groupIndex = Number(button.dataset.copyGroup);
          const session = state.data.sessions[state.activeView];
          const group = session?.groups?.[groupIndex];
          if (!group) {
            showStatus("Could not find this group", "error");
            return;
          }
          const usable = sortGuestNames(groupGuestNames(group).filter(name => !isPlaceholderName(name)));
          const text = usable.join("\n");
          if (!text) {
            showStatus("No guest names to copy", "error");
            return;
          }
          try {
            await copyText(text);
            flashActionButton(button, "copied", "Copy names", "Copied");
            showStatus(`Copied ${usable.length} guest name${usable.length === 1 ? "" : "s"}`);
          } catch (error) {
            showStatus("Could not copy names", "error");
          }
        });
      });

      board.querySelectorAll("[data-paste-group]").forEach(button => {
        button.addEventListener("click", async event => {
          event.preventDefault();
          event.stopPropagation();
          const groupIndex = Number(button.dataset.pasteGroup);
          try {
            const text = await readClipboardText();
            const count = applySortedNamesToGroup(groupIndex, text);
            if (!count) {
              showStatus("No guest names found to paste", "error");
              return;
            }
            saveState();
            renderApp();
            showStatus(`Pasted ${count} name${count === 1 ? "" : "s"} into this group`);
          } catch (error) {
            showStatus("Could not paste names — allow clipboard access or use Edit + Ctrl/Cmd+V", "error");
          }
        });
      });
    }

    function bindNamePasteDistribution() {
      board.querySelectorAll('input[data-path*=".divers."][data-path$=".name"]').forEach(input => {
        input.addEventListener("paste", event => {
          const text = event.clipboardData?.getData("text") ?? "";
          const names = parseNameList(text);
          if (names.length <= 1) return;
          const match = input.dataset.path.match(/^sessions\.[^.]+\.groups\.(\d+)\.divers\.\d+\.name$/);
          if (!match) return;
          event.preventDefault();
          const count = applySortedNamesToGroup(Number(match[1]), names);
          saveState();
          renderApp();
          showStatus(`Pasted ${count} name${count === 1 ? "" : "s"} into this group`);
        });
      });
    }

    function renderApp() {
      syncDerivedCounts();
      board.innerHTML = state.activeView === "overview"
        ? renderOverview(state.data)
        : renderSession(state.data.sessions[state.activeView], state.data);
      syncNavigation();
      syncPlaybackControls();
      document.body.classList.toggle("is-editing", state.editing);
      editToggle.setAttribute("aria-pressed", String(state.editing));
      editToggle.textContent = state.editing ? "Finish editing" : "Edit board";
      bindEditableFields();
      bindCopyNameButtons();
      bindNamePasteDistribution();
      board.querySelectorAll("[data-jump]").forEach(button => button.addEventListener("click", () => {
        setActiveView(button.dataset.jump);
      }));
      board.querySelectorAll("[data-jump]").forEach(button => button.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          setActiveView(button.dataset.jump);
        }
      }));
    }

    function exportData() {
      try {
        const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `tulamben-dive-board-${state.data.date.display.replace(/\s+/g, "-").toLowerCase()}.json`;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
        showStatus("Board data exported");
      } catch (error) {
        showStatus("Could not export board data", "error");
      }
    }

    async function importData(file) {
      if (!file) return;
      try {
        const candidate = JSON.parse(await file.text());
        if (!validateData(candidate)) throw new Error("Invalid board structure");
        state.data = candidate;
        saveState();
        renderApp();
        showStatus("Board data imported");
      } catch (error) {
        showStatus("Import failed — the current board was not changed", "error");
      }
    }

    function resetData() {
      if (!confirm("Restore the original board data? Saved edits will be removed.")) return;
      state.data = structuredClone(BOARD_DATA);
      saveState();
      renderApp();
      showStatus("Original board restored");
    }

    navButtons.forEach(button => button.addEventListener("click", () => {
      setActiveView(button.dataset.view);
    }));

    editToggle.addEventListener("click", () => {
      state.editing = !state.editing;
      if (state.editing) stopAutoplay("Autoplay paused for editing");
      renderApp();
      if (state.editing) board.querySelector("input")?.focus();
    });
    document.querySelector("#export-button").addEventListener("click", exportData);
    document.querySelector("#import-input").addEventListener("change", event => {
      importData(event.target.files?.[0]);
      event.target.value = "";
    });
    document.querySelector("#reset-button").addEventListener("click", resetData);

    autoplayToggle.addEventListener("click", () => {
      if (state.autoplay) stopAutoplay();
      else startAutoplay();
    });

    loopToggle.addEventListener("click", () => {
      state.loop = !state.loop;
      savePlaybackPreferences();
      syncPlaybackControls();
      if (state.autoplay) scheduleNextView();
    });

    intervalSelect.addEventListener("change", () => {
      const custom = intervalSelect.value === "custom";
      customIntervalControl.hidden = !custom;
      if (custom) {
        customInterval.focus();
        return;
      }
      state.intervalSeconds = Number(intervalSelect.value);
      savePlaybackPreferences();
      syncPlaybackControls();
      if (state.autoplay) scheduleNextView();
    });

    function applyCustomInterval(showError = false) {
      if (!validInterval(customInterval.value)) {
        if (showError) {
          customInterval.value = String(state.intervalSeconds);
          showStatus("Enter a whole number from 1 to 3600 seconds", "error");
        }
        return false;
      }
      state.intervalSeconds = Number(customInterval.value);
      savePlaybackPreferences();
      if (state.autoplay) scheduleNextView();
      return true;
    }

    customInterval.addEventListener("input", () => {
      if (!applyCustomInterval(false)) {
        customInterval.setAttribute("aria-invalid", "true");
        showStatus("Enter a whole number from 1 to 3600 seconds", "error");
        return;
      }
      customInterval.removeAttribute("aria-invalid");
    });

    customInterval.addEventListener("change", () => {
      if (!applyCustomInterval(true)) {
        customInterval.removeAttribute("aria-invalid");
        return;
      }
      customInterval.removeAttribute("aria-invalid");
      syncPlaybackControls();
    });

    document.addEventListener("keydown", event => {
      const tag = event.target?.tagName;
      if (["INPUT", "TEXTAREA", "SELECT"].includes(tag)) return;
      if (event.key === "Escape" && state.editing) {
        state.editing = false;
        renderApp();
        editToggle.focus();
        return;
      }
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      const direction = event.key === "ArrowRight" ? 1 : -1;
      const current = VIEWS.indexOf(state.activeView);
      setActiveView(VIEWS[(current + direction + VIEWS.length) % VIEWS.length]);
    });

    syncDerivedCounts();
    renderApp();
  </script>
</body>
</html>
