<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tulamben Daily Dive Board</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f2eee5;
      --paper-card: #fffefd;
      --ink: #123b4b;
      --ink-soft: #416875;
      --aqua: #55c9c1;
      --aqua-dark: #179b97;
      --aqua-pale: #e8f3f3;
      --red: #d94b49;
      --line: #b8d9df;
      --line-strong: #55c9c1;
      --ui-bg: #ece8df;
      --display: "Avenir Next Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
      --mono: "Courier New", ui-monospace, monospace;
      --radius-card: 12px;
      --radius-control: 4px;
      --radius-pill: 999px;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    * { box-sizing: border-box; }
    html { background: var(--ui-bg); }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100dvh;
      overflow-x: hidden;
      color: var(--ink);
      background: var(--ui-bg);
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
    }

    button, input, select { font: inherit; }
    button, .import-button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible, select:focus-visible, .import-button:focus-within {
      outline: 2px solid var(--aqua-dark);
      outline-offset: 3px;
    }

    .app-controls {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: min(100%, 1600px);
      min-height: 54px;
      margin: 0 auto;
      padding: 9px 16px;
      background: rgba(236, 232, 223, .92);
      backdrop-filter: blur(12px);
      transition: opacity .28s var(--ease), transform .28s var(--ease);
    }
    .control-cluster {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .control-brand-nav { flex: 1 1 auto; }
    .playback-controls { flex: 0 1 auto; }
    .ops-controls { flex: 0 1 auto; justify-content: flex-end; }
    .control-brand {
      flex: 0 0 auto;
      margin-right: 8px;
      color: var(--ink-soft);
      font: 800 11px/1 var(--display);
      letter-spacing: .18em;
      white-space: nowrap;
    }
    .view-nav {
      display: flex;
      flex: 1 1 auto;
      justify-content: flex-start;
      gap: 5px;
      min-width: 0;
    }
    .app-controls button,
    .app-controls .import-button {
      display: inline-grid;
      place-items: center;
      min-height: 34px;
      border: 1px solid rgba(18, 59, 75, .22);
      border-radius: var(--radius-control);
      padding: 0 11px;
      color: var(--ink);
      background: #faf8f2;
      cursor: pointer;
      font: 750 10px/1 var(--display);
      letter-spacing: .06em;
      text-transform: uppercase;
      transition: color .18s var(--ease), background .18s var(--ease), border-color .18s var(--ease), transform .18s var(--ease);
    }
    .app-controls button:hover,
    .app-controls .import-button:hover {
      border-color: var(--aqua-dark);
      background: #fff;
    }
    .app-controls button:active,
    .app-controls .import-button:active {
      transform: translateY(1px) scale(.98);
    }
    .view-nav button[aria-current="page"] {
      color: #fff;
      border-color: var(--ink);
      background: var(--ink);
    }
    #edit-toggle {
      color: var(--ink);
      border-color: var(--aqua-dark);
      background: #fff;
      font-weight: 800;
    }
    #edit-toggle:hover { background: var(--aqua-pale); }
    #edit-toggle[aria-pressed="true"] {
      color: #fff;
      border-color: var(--aqua-dark);
      background: var(--aqua-dark);
    }
    #status-message {
      flex: 0 1 180px;
      margin: 0;
      color: var(--aqua-dark);
      font: 700 10px/1.25 var(--display);
      letter-spacing: .03em;
      text-align: right;
    }
    #status-message[data-kind="error"] { color: var(--red); }
    .playback-controls button,
    .playback-controls select,
    .playback-controls input {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius-control);
      color: var(--ink);
      background: rgba(255, 255, 255, .66);
      font: 700 10px/1 var(--display);
      letter-spacing: .04em;
    }
    .playback-controls button { padding: 0 10px; cursor: pointer; }
    .playback-controls button:hover { border-color: var(--aqua-dark); background: #fff; }
    .playback-controls button[aria-pressed="true"] {
      color: #fff;
      border-color: var(--aqua-dark);
      background: var(--aqua-dark);
    }
    .interval-control, .custom-interval-control {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--ink);
      font: 700 10px/1 var(--display);
    }
    .custom-interval-control[hidden] { display: none; }
    .interval-control select { padding: 0 24px 0 8px; }
    .custom-interval-control input { width: 64px; padding: 0 6px; }

    body.is-presenting .app-controls {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }
    body.is-presenting.is-chrome-visible .app-controls,
    body.is-presenting .app-controls:focus-within {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    .slide-stage { width: min(100%, 1600px); margin: 0 auto; padding: 0 16px 16px; }
    #board.slide-canvas {
      position: relative;
      min-height: 0;
      max-height: calc(100dvh - 72px);
      aspect-ratio: 16 / 9;
      overflow: auto;
      padding: clamp(24px, 2.5vw, 42px) clamp(30px, 3.2vw, 54px);
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 14px 42px rgba(38, 58, 59, .16);
      isolation: isolate;
    }
    #board.slide-canvas::before,
    #board.slide-canvas::after {
      content: "";
      position: absolute;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
    }
    #board.slide-canvas::before { top: -160px; right: -100px; width: 390px; height: 390px; background: #dff2ef; }
    #board.slide-canvas::after { bottom: -210px; left: -160px; width: 500px; height: 390px; background: rgba(226, 219, 204, .48); }

    .original-overview,
    .original-session { display: flex; flex-direction: column; width: 100%; height: 100%; min-height: 0; overflow: hidden; animation: boardEnter .28s var(--ease) both; }
    @keyframes boardEnter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .overview-brand-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, .72fr);
      align-items: center;
      gap: 16px;
      flex: 0 0 auto;
      min-height: 0;
    }
    .udive-logo { display: flex; min-width: 0; align-items: center; }
    .udive-logo-image {
      display: block;
      width: min(100%, 520px);
      height: auto;
      max-height: 72px;
      object-fit: contain;
      object-position: left center;
    }

    .deck-date-card {
      position: relative;
      justify-self: end;
      width: min(100%, 340px);
      margin-top: 0;
      padding: 10px 16px;
      border: 2px solid var(--line);
      border-radius: var(--radius-card);
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 6px 10px rgba(32, 59, 65, .18);
    }
    .deck-date-card .date-label { display: block; color: var(--ink-soft); font: 400 11px/1 var(--mono); }
    .deck-date-card strong { display: block; margin-top: 4px; color: var(--aqua-dark); font: 850 clamp(22px, 2.2vw, 34px)/1 var(--display); letter-spacing: .04em; }
    .deck-date-card small { display: block; margin-top: 4px; color: var(--ink-soft); font: 500 13px/1.2 var(--display); }

    .deck-title {
      flex: 0 0 auto;
      margin: 4px 2px 6px;
      color: var(--ink-soft);
      font: 500 clamp(12px, 1.1vw, 16px)/1 var(--mono);
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .tide-strip {
      display: grid;
      grid-template-columns: auto minmax(0, 1.1fr) minmax(0, 1.5fr) 96px;
      gap: 6px 12px;
      align-items: center;
      flex: 0 0 auto;
      min-width: 0;
      margin: 0 0 8px;
      padding: 6px 12px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, .92);
    }
    .tide-strip-copy { display: contents; }
    .tide-kicker {
      color: var(--ink-soft);
      font: 700 10px/1 var(--mono);
      letter-spacing: .12em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .tide-now {
      min-width: 0;
      color: var(--aqua-dark);
      font: 800 clamp(13px, 1.2vw, 18px)/1.15 var(--display);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tide-extrema {
      min-width: 0;
      color: var(--ink);
      font: 550 clamp(11px, .95vw, 13px)/1.2 var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tide-note { display: none; }
    .tide-spark {
      width: 100%;
      height: 22px;
      color: var(--aqua-dark);
    }
    .schedule-time-block { min-width: 0; overflow: hidden; }
    .schedule-tide-caption {
      margin: 2px 0 0;
      color: var(--aqua-dark);
      font: 650 clamp(10px, .85vw, 12px)/1.2 var(--mono);
      letter-spacing: .03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .schedule-tide-caption span {
      display: inline;
      margin-right: 6px;
      color: var(--ink-soft);
      font-weight: 500;
    }
    .session-date { display: grid; justify-items: end; gap: 6px; }
    .session-tide {
      max-width: 52ch;
      color: var(--aqua-dark);
      font: 650 clamp(11px, .95vw, 13px)/1.3 var(--mono);
      text-align: right;
    }
    .schedule-grid { display: grid; flex: 1 1 auto; grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 8px; min-height: 0; overflow: hidden; }
    .schedule-column {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, .5fr) minmax(0, .45fr) minmax(0, 1.55fr);
      align-items: center;
      gap: 8px 16px;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      padding: 8px 20px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, .96);
      box-shadow: 0 6px 9px rgba(37, 60, 63, .16);
      cursor: pointer;
      transition: border-color .2s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease);
    }
    .is-editing .schedule-column { cursor: default; }
    .schedule-column:hover {
      border-color: var(--aqua-dark);
      transform: translateY(-1px);
    }
    .is-editing .schedule-column:hover { transform: none; }
    .schedule-column:active { transform: translateY(0) scale(.995); }
    .schedule-time { margin: 0; color: var(--ink); font: 650 clamp(22px, 2.4vw, 40px)/1 var(--mono); letter-spacing: .04em; }
    .schedule-metric,
    .schedule-site { min-width: 0; overflow: hidden; }
    .schedule-metric span,
    .schedule-site span { display: block; color: var(--ink-soft); font: 400 11px/1 var(--mono); letter-spacing: .05em; }
    .schedule-metric strong { display: block; margin-top: 4px; color: var(--aqua-dark); font: 800 clamp(16px, 1.6vw, 24px)/1 var(--display); }
    .schedule-column[data-empty="true"] .schedule-metric strong {
      color: var(--ink-soft);
      font-weight: 500;
    }
    .schedule-site strong {
      display: block;
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ink);
      font: 750 clamp(15px, 1.45vw, 22px)/1.15 var(--display);
    }
    .schedule-empty {
      display: none;
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--ink-soft);
      font: 500 11px/1.2 var(--mono);
    }
    .schedule-column[data-empty="true"] .schedule-empty { display: block; }

    .session-header {
      display: grid;
      grid-template-columns: minmax(220px, .72fr) minmax(220px, .9fr) minmax(220px, .8fr);
      align-items: center;
      gap: 26px;
      min-height: 105px;
      border-bottom: 3px solid #d3e6e7;
    }
    .session-time-block { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .session-time { margin: 0; font: 700 clamp(55px, 6.2vw, 96px)/.9 var(--mono); letter-spacing: .04em; }
    .session-briefing {
      margin: 0;
      color: var(--ink-soft);
      font: 500 clamp(12px, 1.05vw, 16px)/1 var(--mono);
      letter-spacing: .04em;
    }
    .session-summary-line {
      display: grid;
      grid-template-columns: auto auto;
      justify-content: start;
      gap: 28px;
      min-width: 0;
    }
    .session-date { justify-self: end; color: var(--ink-soft); font: 750 clamp(19px, 2vw, 31px)/1 var(--display); }

    .group-grid { display: grid; flex: 1 1 auto; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 10px 14px; min-height: 0; padding: 18px 0 8px; }
    .group-cell {
      display: grid;
      grid-template-columns: minmax(96px, .88fr) minmax(120px, 1.22fr);
      gap: 8px 10px;
      min-width: 0;
      min-height: 0;
      height: 100%;
      align-items: stretch;
      overflow: hidden;
      padding: 8px 9px;
      border: 2px solid var(--line);
      border-radius: 11px;
      background: rgba(255, 255, 255, .95);
      box-shadow: 0 6px 8px rgba(39, 62, 64, .16);
    }
    .group-cell[data-empty="true"] {
      border-style: dashed;
      background: rgba(255, 255, 255, .42);
      box-shadow: none;
      opacity: .78;
    }
    .is-editing .group-cell[data-empty="true"] { opacity: 1; }
    .group-dm-pane {
      display: flex;
      min-width: 0;
      min-height: 0;
      height: 100%;
      flex-direction: column;
      gap: 5px;
      overflow: hidden;
      padding-right: 8px;
      border-right: 2px solid #d3e6e7;
    }
    .group-guest-pane {
      display: flex;
      min-width: 0;
      min-height: 0;
      height: 100%;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }
    .guest-meta {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px;
      align-items: center;
      flex: 0 0 auto;
      min-width: 0;
    }
    .guest-meta .group-context { min-width: 0; }
    .guest-meta .capacity { justify-self: end; white-space: nowrap; }
    .group-activity-row {
      display: flex;
      gap: 4px;
      min-width: 0;
      align-items: center;
    }
    .activity-select,
    .course-select {
      min-width: 0;
      min-height: 22px;
      max-height: 24px;
      border: 1.5px solid var(--line);
      border-radius: 7px;
      padding: 0 4px;
      color: var(--aqua-dark);
      background: #fff;
      font: 650 clamp(10px, .8vw, 12px)/1 var(--mono);
    }
    .activity-select { flex: 1 1 auto; }
    .course-select { flex: 0 0 4.8em; width: 4.8em; }
    .group-top { display: block; flex: 0 0 auto; }
    .group-marker { display: none; }
    .dm-block .micro-label { display: block; color: var(--ink-soft); font: 400 10px/1 var(--mono); }
    .dm-name { display: block; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); font: 750 clamp(12px, 1.1vw, 17px)/1.05 var(--display); text-transform: none; }
    .group-cell[data-open="true"] .dm-name,
    .group-cell[data-empty="true"] .dm-name { color: var(--ink-soft); font-style: italic; font-weight: 450; }
    .capacity { flex: 0 0 auto; color: var(--red); font: 650 clamp(12px, 1.05vw, 16px)/1 var(--mono); }
    .group-cell[data-open="true"] .capacity,
    .group-cell[data-empty="true"] .capacity { color: var(--ink-soft); }
    .group-context { flex: 0 0 auto; min-height: 0; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--aqua-dark); font: 400 clamp(10px, .85vw, 12px)/1.2 var(--mono); text-transform: none; }
    .diver-list { display: grid; gap: 3px; flex: 1 1 auto; min-height: 0; margin: 0; padding: 0; list-style: none; align-content: start; overflow: hidden; }
    .diver-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) 12px; gap: 5px; min-height: 0; height: 28px; align-items: center; padding: 0 6px; border: 2px solid #d4e7e8; border-radius: 7px; background: var(--aqua-pale); }
    .diver-index { color: var(--aqua-dark); font: 600 12px/1 var(--mono); }
    .diver-name { overflow-wrap: anywhere; color: var(--ink); font: 650 clamp(12px, 1.05vw, 16px)/1.1 var(--display); text-transform: none; }
    .group-cell[data-open="true"] .diver-name,
    .group-cell[data-empty="true"] .diver-name { color: var(--ink-soft); font-style: italic; font-weight: 450; }
    .diver-note { color: var(--ink-soft); font: 500 11px/1 var(--mono); text-align: right; }
    .group-copy-row { display: flex; flex: 0 0 auto; flex-wrap: wrap; justify-content: flex-end; gap: 3px; margin-top: auto; }
    .copy-names-btn,
    .paste-names-btn {
      min-height: 22px;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-pill);
      padding: 0 8px;
      color: var(--aqua-dark);
      background: var(--aqua-pale);
      cursor: pointer;
      font: 700 9px/1 var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
      transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease), transform .15s var(--ease);
    }
    .copy-names-btn:hover,
    .paste-names-btn:hover { border-color: var(--aqua); color: var(--ink); background: var(--aqua); }
    .copy-names-btn:active,
    .paste-names-btn:active { transform: translateY(1px) scale(.98); }
    .copy-names-btn[data-copied="true"],
    .paste-names-btn[data-pasted="true"] { border-color: var(--aqua); color: var(--ink); background: var(--aqua); }

    .dm-photo {
      display: grid;
      place-items: center;
      flex: 1 1 0;
      width: 100%;
      min-height: 42px;
      max-height: 100%;
      overflow: hidden;
      border: 2px solid #d3e6e7;
      border-radius: 8px;
      background: var(--aqua-pale);
      color: var(--ink-soft);
      font: 700 16px/1 var(--display);
    }
    .dm-photo img {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      object-position: center top;
      display: block;
      background: var(--aqua-pale);
    }
    .dm-select {
      flex: 0 0 auto;
      width: 100%;
      min-height: 26px;
      max-height: 28px;
      border: 1.5px solid var(--line);
      border-radius: 7px;
      padding: 0 6px;
      color: var(--ink);
      background: #fff;
      font: 650 clamp(11px, .95vw, 13px)/1 var(--display);
    }
    .dm-roster-modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(7, 24, 30, .55);
    }
    .dm-roster-modal[hidden] { display: none; }
    .dm-roster-panel {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      width: min(920px, 100%);
      max-height: min(86vh, 900px);
      overflow: hidden;
      border: 2px solid var(--line);
      border-radius: var(--radius-card);
      background: #f7f4ec;
      box-shadow: 0 24px 80px rgba(18, 59, 75, .22);
    }
    .dm-roster-header, .dm-roster-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 18px;
      border-bottom: 2px solid #d3e6e7;
    }
    .dm-roster-footer { border-bottom: 0; border-top: 2px solid #d3e6e7; }
    .dm-roster-header h2 { margin: 0; color: var(--ink); font: 800 20px/1 var(--display); letter-spacing: .04em; }
    .dm-roster-header p { margin: 6px 0 0; color: var(--ink-soft); font: 500 13px/1.3 var(--mono); }
    .dm-roster-list {
      display: grid;
      gap: 12px;
      overflow: auto;
      padding: 16px 18px;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      align-content: start;
    }
    .dm-roster-card {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 2px solid var(--line);
      border-radius: var(--radius-card);
      background: #fff;
    }
    .dm-roster-card .dm-photo { aspect-ratio: 3 / 4; max-height: 280px; }
    .dm-roster-card input[type="text"] {
      width: 100%;
      min-height: 36px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      padding: 0 10px;
      font: 650 14px/1 var(--display);
      color: var(--ink);
      background: #faf8f2;
    }
    .dm-roster-card-actions, .dm-roster-footer-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .dm-roster-card-actions button,
    .dm-roster-footer-actions button,
    .dm-roster-header button,
    #dm-roster-toggle {
      min-height: 34px;
      border: 1px solid rgba(18, 59, 75, .22);
      border-radius: var(--radius-control);
      padding: 0 11px;
      color: var(--ink);
      background: #faf8f2;
      cursor: pointer;
      font: 750 10px/1 var(--display);
      letter-spacing: .06em;
      text-transform: uppercase;

      z-index: 70;
      background: rgba(18, 59, 75, .28);
    }
    .ai-assistant-drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 71;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      width: min(420px, 100%);
      height: 100dvh;
      overflow: hidden;
      border-left: 2px solid var(--line);
      background: #f7f4ec;
      box-shadow: -18px 0 40px rgba(18, 59, 75, .16);
    }
    .ai-assistant-drawer[hidden],
    .ai-assistant-overlay[hidden] { display: none; }
    .ai-assistant-header,
    .ai-assistant-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 16px 18px;
      border-bottom: 2px solid #d3e6e7;
    }
    .ai-assistant-footer { border-bottom: 0; border-top: 2px solid #d3e6e7; flex-wrap: wrap; }
    .ai-assistant-header h2 { margin: 0; color: var(--ink); font: 800 18px/1 var(--display); letter-spacing: .04em; }
    .ai-assistant-notice {
      margin: 0;
      padding: 12px 18px;
      color: var(--ink-soft);
      font: 500 12px/1.45 var(--mono);
      background: var(--aqua-pale);
    }
    .ai-assistant-body { display: grid; gap: 10px; overflow: auto; padding: 16px 18px; align-content: start; }
    .ai-assistant-body label {
      color: var(--ink-soft);
      font: 700 11px/1 var(--mono);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    #ai-assistant-input {
      width: 100%;
      min-height: 96px;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      color: var(--ink);
      background: #fff;
      font: 500 14px/1.4 var(--display);
      resize: vertical;
    }
    .ai-assistant-examples { margin: 0; color: var(--ink-soft); font: 500 11px/1.45 var(--mono); }
    #ai-assistant-status { min-height: 1.2em; margin: 0; color: var(--aqua-dark); font: 700 12px/1.4 var(--display); }
    #ai-assistant-status[data-kind="error"] { color: var(--red); }
    #ai-assistant-status[data-kind="loading"] { color: var(--ink-soft); }
    .ai-assistant-drawer.is-loading #ai-assistant-input { opacity: .6; }
    .ai-message { margin: 0; font: 650 14px/1.4 var(--display); }
    .ai-actions, .ai-warnings, .ai-errors { margin: 0; padding-left: 18px; font: 500 12px/1.4 var(--mono); }
    .ai-warnings { color: var(--ink-soft); }
    .ai-errors { color: var(--red); }
    .ai-assistant-footer button {
      min-height: 34px;
      border: 1px solid rgba(18, 59, 75, .22);
      border-radius: var(--radius-control);
      padding: 0 11px;
      color: var(--ink);
      background: #faf8f2;
      cursor: pointer;
      font: 750 10px/1 var(--display);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    #ai-assistant-apply {
      color: #fff;
      border-color: var(--aqua-dark);
      background: var(--aqua-dark);
    }
    #ai-assistant-apply:disabled { opacity: .45; cursor: not-allowed; }
    #ai-assistant-close, #ai-assistant-cancel, #ai-assistant-clear, #ai-assistant-send {
      color: var(--ink);
    }

    .slide-footer { display: flex; justify-content: space-between; gap: 18px; flex: 0 0 auto; margin-top: 10px; padding-top: 9px; border-top: 3px solid #d3e6e7; color: var(--ink-soft); font: 400 clamp(11px, 1vw, 16px)/1.2 var(--mono); letter-spacing: .03em; }
    .original-overview .slide-footer { border-top: 0; }
    .slide-footer strong { color: var(--ink-soft); font-weight: 400; white-space: nowrap; }

    .is-editing .schedule-column,
    .is-editing .group-cell { border-color: var(--red); }
    .slide-canvas .edit-field {
      width: 100%;
      min-width: 0;
      border: 0;
      border-bottom: 2px dashed rgba(217, 75, 73, .55);
      border-radius: 0;
      padding: 1px 2px;
      color: inherit;
      background: rgba(217, 75, 73, .07);
      font: inherit;
      letter-spacing: inherit;
      text-align: inherit;
      text-transform: inherit;
    }
    .slide-canvas .edit-inline { display: inline-block; width: auto; max-width: 100%; }
    .slide-canvas .edit-number { width: 3em; }

    @media (max-width: 1400px) {
      #board.slide-canvas { padding: 20px 34px; }
      .session-header { min-height: 82px; }
      .session-time { font-size: clamp(48px, 5.4vw, 76px); }
      .group-grid { gap: 8px 10px; padding: 12px 0 6px; }
      .group-cell { padding: 10px; gap: 8px 10px; }
      .dm-name { margin-top: 4px; font-size: clamp(13px, 1.2vw, 18px); }
      .dm-photo { min-height: 36px; }
      .group-context { font-size: clamp(10px, .9vw, 13px); }
      .diver-list { gap: 3px; }
      .diver-row { min-height: 28px; padding: 0 6px; }
      .diver-name { font-size: clamp(11px, 1vw, 15px); }
      .slide-footer { margin-top: 6px; padding-top: 6px; }
    }

    @media (max-width: 1120px) {
      .overview-brand-row { gap: 12px; }
      .udive-logo-image { max-height: 64px; }
      .deck-date-card { max-width: 280px; padding: 8px 14px; }
      .schedule-column { gap: 8px 12px; padding: 8px 14px; }
      .group-cell { padding: 10px; grid-template-columns: minmax(110px, .95fr) minmax(120px, 1.15fr); }
      .group-grid { gap: 8px 10px; padding-top: 14px; }
      .dm-photo { min-height: 36px; }
    }

    @media (max-width: 900px) {
      .app-controls { flex-wrap: wrap; position: relative; }
      .control-brand-nav { flex-basis: 100%; }
      .view-nav { overflow-x: auto; }
      #board.slide-canvas {
        aspect-ratio: auto;
        min-height: calc(100dvh - 110px);
        max-height: none;
        overflow: visible;
      }
      .original-overview, .original-session { overflow: visible; height: auto; }
      .overview-brand-row { grid-template-columns: 1fr 1fr; }
      .schedule-grid { grid-template-rows: none; overflow: visible; }
      .schedule-column { grid-template-columns: minmax(0, 1fr) minmax(0, .55fr) minmax(0, .5fr) minmax(0, 1.4fr); }
      .group-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: none; }
      .group-cell { grid-template-columns: minmax(100px, .9fr) minmax(120px, 1.2fr); }
      .session-header { grid-template-columns: 1fr 1.5fr; }
      .session-date { grid-column: 1 / -1; justify-self: end; }
      .tide-strip { grid-template-columns: auto minmax(0, 1fr) 80px; }
      .tide-extrema { grid-column: 1 / -1; }
    }

    @media (max-width: 760px) {
      .playback-controls, .ops-controls { flex: 1 0 100%; flex-wrap: wrap; }
    }

    @media (max-width: 620px) {
      .app-controls { padding: 8px 10px; }
      .control-brand { display: none; }
      .view-nav { flex-wrap: nowrap; }
      .view-nav button { flex: 0 0 auto; }
      #status-message { flex-basis: 100%; text-align: left; }
      .slide-stage { padding: 0; overflow-x: clip; }
      #board.slide-canvas { padding: 24px 16px; overflow-x: clip; overflow-y: visible; box-shadow: none; }
      .overview-brand-row { grid-template-columns: 1fr; gap: 12px; }
      .udive-logo-image { width: min(100%, 520px); max-height: 72px; }
      .deck-date-card { justify-self: stretch; width: 100%; margin-top: 0; padding: 12px 16px; }
      .deck-date-card strong { font-size: 28px; }
      .deck-date-card small { margin-top: 6px; }
      .deck-title { margin-top: 8px; font-size: 12px; line-height: 1.35; }
      .schedule-column { grid-template-columns: minmax(0, 1.3fr) minmax(0, .7fr) minmax(0, .7fr); gap: 10px 12px; padding: 12px 14px; overflow: hidden; }
      .schedule-time { font-size: 28px; }
      .schedule-site { grid-column: 1 / -1; }
      .session-header { grid-template-columns: 1fr; gap: 14px; padding-bottom: 20px; }
      .session-time { font-size: 58px; }
      .session-summary-line { display: grid; grid-template-columns: 1fr 1fr; }
      .session-date { grid-column: auto; justify-self: start; justify-items: start; }
      .session-tide { text-align: left; }
      .group-grid { grid-template-columns: 1fr; grid-template-rows: none; padding-top: 18px; }
      .group-cell { min-height: 0; grid-template-columns: minmax(110px, .9fr) minmax(140px, 1.2fr); }
      .slide-footer { display: block; line-height: 1.5; }
      .slide-footer strong { display: block; margin-top: 8px; }
      .ai-assistant-drawer { width: 100%; }
      .tide-strip { grid-template-columns: 1fr; padding: 10px 12px; }
      .session-date, .session-tide { justify-items: start; text-align: left; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }

    const STORAGE_KEY = "tulamben-dive-board-v5";
    const PLAYBACK_STORAGE_KEY = "tulamben-dive-board-playback-v1";
    const board = document.querySelector("#board");
    const navButtons = [...document.querySelectorAll("[data-view]")];
    const editToggle = document.querySelector("#edit-toggle");
    const statusMessage = document.querySelector("#status-message");
    const autoplayToggle = document.querySelector("#autoplay-toggle");
    const loopToggle = document.querySelector("#loop-toggle");
    const intervalSelect = document.querySelector("#interval-select");
    const customIntervalControl = document.querySelector(".custom-interval-control");
    const customInterval = document.querySelector("#custom-interval");
    const requiredSessionIds = ["slot-0900", "slot-1100", "slot-1400", "slot-1830"];
    const VIEWS = ["overview", ...requiredSessionIds];

    function validateData(value) {
      return Boolean(
        value && value.date && typeof value.date.display === "string"
        && Array.isArray(value.overview) && value.overview.length === 4
        && value.sessions && requiredSessionIds.every(id =>
          value.sessions[id] && Array.isArray(value.sessions[id].groups)
          && value.sessions[id].groups.length === 9
        )
      );
    }

    function migrateGroupActivity(group) {
      if (!group || typeof group !== "object") return group;
      if (group.activity === "fundive" || group.activity === "courses") {
        if (group.activity !== "courses") group.course = "";
        else if (group.course !== "OW" && group.course !== "AOW") group.course = "";
        if (!String(group.context ?? "").trim()) group.context = "—";
        return group;
      }
      const raw = String(group.context ?? "").trim();
      const parts = raw.split(/\s*[·•]\s*/).map(part => part.trim()).filter(Boolean);
      const first = (parts[0] || "").toLowerCase();
      if (first === "fundive" || first === "fun dive" || first === "fun-dive") {
        group.activity = "fundive";
        group.course = "";
        group.context = parts.slice(1).join(" · ") || "—";
        return group;
      }
      if (first === "course" || first === "courses") {
        const rest = parts.slice(1);
        const level = (rest[0] || "").toUpperCase();
        group.activity = "courses";
        if (level === "OW" || level === "AOW") {
          group.course = level;
          group.context = rest.slice(1).join(" · ") || "—";
        } else {
          group.course = "";
          group.context = rest.join(" · ") || "—";
        }
        return group;
      }
      group.activity = group.activity || "";
      group.course = group.course || "";
      if (!raw) group.context = "—";
      return group;
    }

    function formatGroupHeadline(group) {
      const activity = group?.activity === "fundive" ? "Fundive"
        : group?.activity === "courses" ? (group.course ? `Courses · ${group.course}` : "Courses")
        : "";
      const notes = String(group?.context ?? "").trim();
      const hasNotes = notes && notes !== "—" && notes !== "-";
      if (activity && hasNotes) return `${activity} · ${notes}`;
      if (activity) return activity;
      return hasNotes ? notes : "—";
    }

    function ensureDmRoster(data) {
      if (!Array.isArray(data.dmRoster)) data.dmRoster = [];
      data.dmRoster = data.dmRoster.map((item, index) => ({
        id: item?.id || `dm-${index + 1}-${Math.random().toString(36).slice(2, 7)}`,
        name: String(item?.name ?? "").trim(),
        photo: typeof item?.photo === "string" ? item.photo : ""
      }));
      const knownIds = new Set(data.dmRoster.map(item => item.id));
      const knownNames = new Set(data.dmRoster.map(item => item.name.toLowerCase()).filter(Boolean));
      for (const item of BOARD_DATA.dmRoster || []) {
        const name = String(item?.name || "").trim().toLowerCase();
        if (!item?.id || knownIds.has(item.id) || (name && knownNames.has(name))) continue;
        data.dmRoster.push({
          id: item.id,
          name: String(item.name || "").trim(),
          photo: typeof item.photo === "string" ? item.photo : ""
        });
        knownIds.add(item.id);
        if (name) knownNames.add(name);
      }
      for (const id of requiredSessionIds) {
        for (const group of data.sessions?.[id]?.groups || []) {
          if (typeof group.dmId !== "string") group.dmId = "";
          migrateGroupActivity(group);
        }
      }
      return data;
    }

    function normalizeGroupCount(data) {
      const emptyGroup = () => structuredClone({
        marker: "?",
        dm: "unassigned",
        capacity: "0/3",
        activity: "",
        course: "",
        context: "—",
        divers: [
          { name: "open", note: "" },
          { name: "open", note: "" },
          { name: "open", note: "" }
        ]
      });
      for (const id of requiredSessionIds) {
        const session = data?.sessions?.[id];
        if (!session || !Array.isArray(session.groups)) continue;
        while (session.groups.length < 9) session.groups.push(emptyGroup());
        session.groups = session.groups.slice(0, 9);
      }
      return data;
    }

    function loadData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (!saved) return ensureDmRoster(structuredClone(BOARD_DATA));
        const parsed = ensureDmRoster(normalizeGroupCount(JSON.parse(saved)));
        return validateData(parsed) ? parsed : ensureDmRoster(structuredClone(BOARD_DATA));
      } catch (error) {
        return ensureDmRoster(structuredClone(BOARD_DATA));
      }
    }

    function validInterval(value) {
      const seconds = Number(value);
      return Number.isInteger(seconds) && seconds >= 1 && seconds <= 3600;
    }

    function loadPlaybackPreferences() {
      try {
        const parsed = JSON.parse(localStorage.getItem(PLAYBACK_STORAGE_KEY) || "null");
        return {
          loop: Boolean(parsed?.loop),
          intervalSeconds: validInterval(parsed?.intervalSeconds) ? Number(parsed.intervalSeconds) : 5
        };
      } catch (error) {
        return { loop: false, intervalSeconds: 5 };
      }
    }

    const playbackPreferences = loadPlaybackPreferences();
    const state = {
      activeView: "overview",
      editing: false,
      autoplay: false,
      autoplayTimer: null,
      loop: playbackPreferences.loop,
      intervalSeconds: playbackPreferences.intervalSeconds,
      data: loadData()
    };

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>'"]/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;"
      })[character]);
    }

    const MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
    const MONTH_INDEX = Object.fromEntries(MONTHS.map((month, index) => [month, index]));

    function parseBoardDate(display) {
      const match = String(display ?? "").trim().match(/^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})$/);
      if (!match) return null;
      const day = Number(match[1]);
      const month = MONTH_INDEX[match[2].toUpperCase()];
      const year = Number(match[3]);
      if (month === undefined) return null;
      const date = new Date(year, month, day);
      if (date.getFullYear() !== year || date.getMonth() !== month || date.getDate() !== day) return null;
      return date;
    }

    function formatBoardDate(date) {
      return `${date.getDate()} ${MONTHS[date.getMonth()]} ${date.getFullYear()}`;
    }

    function formatWeekday(date) {
      return date.toLocaleDateString("en-US", { weekday: "long" });
    }

    function baliToday() {
      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "Asia/Makassar",
        year: "numeric",
        month: "short",
        day: "numeric",
        weekday: "long"
      }).formatToParts(new Date());
      const pick = type => parts.find(part => part.type === type)?.value || "";
      return {
        display: `${Number(pick("day"))} ${pick("month").slice(0, 3).toUpperCase()} ${pick("year")}`,
        weekday: pick("weekday")
      };
    }

    function stampBoardToToday(data) {
      if (!data?.date) return false;
      const today = baliToday();
      if (data.date.display === today.display && data.date.weekday === today.weekday) return false;
      data.date.display = today.display;
      data.date.weekday = today.weekday;
      return true;
    }

    function persistBoardQuietly() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
      } catch {}
    }

    function msUntilNextBaliMidnight() {
      const iso = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Makassar",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).format(new Date());
      const [year, month, day] = iso.split("-").map(Number);
      const next = Date.UTC(year, month - 1, day + 1, 0, 0, 0) - 8 * 60 * 60 * 1000;
      return Math.max(1000, next - Date.now() + 250);
    }

    function armDateRollover() {
      setTimeout(() => {
        if (stampBoardToToday(state.data)) {
          persistBoardQuietly();
          renderApp();
        }
        armDateRollover();
      }, msUntilNextBaliMidnight());
    }

    function toDateInputValue(display) {
      const parsed = parseBoardDate(display);
      if (!parsed) return "";
      const month = String(parsed.getMonth() + 1).padStart(2, "0");
      const day = String(parsed.getDate()).padStart(2, "0");
      return `${parsed.getFullYear()}-${month}-${day}`;
    }

    function syncDateDerivedFields(displayValue) {
      const parsed = parseBoardDate(displayValue);
      if (!parsed) return false;
      const weekday = formatWeekday(parsed);
      state.data.date.display = formatBoardDate(parsed);
      state.data.date.weekday = weekday;
      board.querySelectorAll('input[data-path="date.display"]').forEach(input => {
        if (input.dataset.kind === "date") input.value = toDateInputValue(state.data.date.display);
        else input.value = state.data.date.display;
      });
      board.querySelectorAll('input[data-path="date.weekday"]').forEach(input => {
        input.value = weekday;
      });
      board.querySelectorAll("[data-date-display]").forEach(node => {
        node.textContent = state.data.date.display;
      });
      board.querySelectorAll("[data-date-weekday]").forEach(node => {
        node.textContent = weekday;
      });
      return true;
    }

    function editableField(path, value, label, options = {}) {
      if (!state.editing) {
        if (path === "date.display") return `<span data-date-display>${escapeHTML(value)}</span>`;
        if (path === "date.weekday") return `<span data-date-weekday>${escapeHTML(value)}</span>`;
        return escapeHTML(value);
      }
      if (path === "date.display") {
        const className = options.className ? ` ${options.className}` : "";
        return `<input class="edit-field edit-date${className}" type="date" data-path="date.display" data-kind="date" aria-label="${escapeHTML(label)}" value="${escapeHTML(toDateInputValue(value))}">`;
      }
      if (path === "date.weekday") {
        return `<input class="edit-field edit-weekday" type="text" data-path="date.weekday" data-kind="text" readonly tabindex="-1" aria-label="${escapeHTML(label)} (auto from date)" value="${escapeHTML(value)}">`;
      }
      const type = options.type || "text";
      const inputMode = type === "number" ? " inputmode=\"numeric\"" : "";
      const className = options.className ? ` ${options.className}` : "";
      return `<input class="edit-field${className}" type="${type}"${inputMode} data-path="${escapeHTML(path)}" data-kind="${type}" aria-label="${escapeHTML(label)}" value="${escapeHTML(value)}">`;
    }

    function isGroupEmpty(group) {
      return isPlaceholderDm(resolveDmName(group)) && countGroupDivers(group) === 0;
    }

    function renderOverview(data) {
      const rows = data.overview.map((item, index) => {
        const empty = Number(item.dmGroups) === 0 && Number(item.divers) === 0;
        return `
        <section class="schedule-column" data-slot="${escapeHTML(item.id)}" data-empty="${empty}" ${state.editing ? "" : `data-jump="${escapeHTML(item.id)}" role="button" tabindex="0"`} aria-label="${state.editing ? "Edit" : "Open"} ${escapeHTML(item.time)} board">
          <div class="schedule-time-block">
            <h2 class="schedule-time">${editableField(`overview.${index}.time`, item.time, `Time slot ${index + 1}`, { className: "edit-inline" })}</h2>
            <p class="schedule-tide-caption" data-tide-slot="${escapeHTML(item.id)}"><span>SEA</span><strong>—</strong></p>
          </div>
          <div class="schedule-metric"><span>DM GROUPS</span><strong data-auto-metric="overview.${index}.dmGroups">${escapeHTML(item.dmGroups)}</strong></div>
          <div class="schedule-metric"><span>DIVERS</span><strong data-auto-metric="overview.${index}.divers">${escapeHTML(item.divers)}</strong></div>

              <span class="date-label">DATE</span>
              <strong>${editableField("date.display", data.date.display, "Board date")}</strong>

            </div>

          <h1 class="deck-title">TULAMBEN · DAILY DIVE BOARD</h1>

              <span class="tide-kicker">Tulamben sea</span>
              <strong class="tide-now" data-tide-now>Loading tide…</strong>
              <span class="tide-extrema" data-tide-extrema></span>
              <p class="tide-note" data-tide-note>Modeled sea level and wave · WITA · not for navigation</p>
            </div>
            <svg class="tide-spark" data-tide-spark viewBox="0 0 96 28" aria-hidden="true"></svg>
          </section>
          <div class="schedule-grid">${rows}</div>
          <footer class="slide-footer"><span>${editableField("overviewSafety", data.overviewSafety, "Overview safety note")}</span><strong>UDIVEBALI TULAMBEN</strong></footer>
        </article>`;

    function renderSession(session, data) {
      const sessionPath = `sessions.${state.activeView}`;
      const groups = session.groups.map((group, groupIndex) => {
        const empty = isGroupEmpty(group);
        const divers = group.divers.map((diver, diverIndex) => `
          <li class="diver-row">
            <span class="diver-index">${diverIndex + 1}</span>
            <span class="diver-name">${editableField(`${sessionPath}.groups.${groupIndex}.divers.${diverIndex}.name`, diver.name, `Group ${groupIndex + 1} diver ${diverIndex + 1}`)}</span>
            <span class="diver-note">${editableField(`${sessionPath}.groups.${groupIndex}.divers.${diverIndex}.note`, diver.note, `Note for group ${groupIndex + 1} diver ${diverIndex + 1}`, { className: "edit-inline" })}</span>
          </li>`).join("");
        return `
          <section class="group-cell" data-group-index="${groupIndex}" data-open="${group.dm === "unassigned"}" data-empty="${empty}" aria-label="Group ${groupIndex + 1}">

                <span class="dm-block"><span class="micro-label">DM</span><strong class="dm-name">${escapeHTML(resolveDmName(group))}</strong></span>

              <div class="schedule-metric"><span>DIVERS</span><strong data-auto-session-divers>${escapeHTML(totals.divers)}</strong></div>
            </div>
            <div class="session-date">
              ${editableField("date.display", data.date.display, "Board date")}

          </header>
          <div class="group-grid">${groups}</div>
          <footer class="slide-footer"><span>${editableField("safety", data.safety, "Safety note")}</span><strong>UDIVEBALI TULAMBEN</strong></footer>
        </article>`;

    function syncNavigation() {
      navButtons.forEach(button => {
        const current = button.dataset.view === state.activeView;
        if (current) button.setAttribute("aria-current", "page");
        else button.removeAttribute("aria-current");
      });
    }

    function syncPlaybackControls() {
      autoplayToggle.setAttribute("aria-pressed", String(state.autoplay));
      autoplayToggle.textContent = state.autoplay ? "Autoplay: Playing" : "Autoplay: Off";
      loopToggle.setAttribute("aria-pressed", String(state.loop));
      loopToggle.textContent = state.loop ? "Loop: On" : "Loop: Off";
      const preset = [5, 10, 15, 30, 60].includes(state.intervalSeconds);
      intervalSelect.value = preset ? String(state.intervalSeconds) : "custom";
      customIntervalControl.hidden = preset;
      customInterval.value = String(state.intervalSeconds);
    }

    function setActiveView(view, { restartTimer = true } = {}) {
      if (!VIEWS.includes(view)) return;
      state.activeView = view;
      renderApp();
      if (restartTimer && state.autoplay) scheduleNextView();
    }

    function setAtPath(target, path, value) {
      const keys = path.split(".");
      const finalKey = keys.pop();
      const parent = keys.reduce((current, key) => current[key], target);
      parent[finalKey] = value;
    }

    let statusTimer;
    function showStatus(message, kind = "ok") {
      clearTimeout(statusTimer);
      statusMessage.textContent = message;
      statusMessage.dataset.kind = kind;
      statusTimer = setTimeout(() => { statusMessage.textContent = ""; }, 3600);
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data));
        showStatus("Changes saved on this device");
        return true;
      } catch (error) {
        showStatus("Changes are active, but browser storage is unavailable", "error");
        return false;
      }
    }

    function savePlaybackPreferences() {
      try {
        localStorage.setItem(PLAYBACK_STORAGE_KEY, JSON.stringify({
          loop: state.loop,
          intervalSeconds: state.intervalSeconds
        }));
      } catch (error) {
        showStatus("Playback settings could not be saved", "error");
      }
    }

    function clearAutoplayTimer() {
      if (state.autoplayTimer !== null) clearTimeout(state.autoplayTimer);
      state.autoplayTimer = null;
    }

    function scheduleNextView() {
      clearAutoplayTimer();
      if (!state.autoplay || state.editing) return;
      state.autoplayTimer = setTimeout(() => {
        const currentIndex = VIEWS.indexOf(state.activeView);
        const atLastView = currentIndex === VIEWS.length - 1;
        if (atLastView && !state.loop) {
          stopAutoplay("Autoplay finished");
          return;
        }
        setActiveView(VIEWS[(currentIndex + 1) % VIEWS.length], { restartTimer: true });
      }, state.intervalSeconds * 1000);
    }

    let chromeHideTimer;
    function setPresenting(on) {
      document.body.classList.toggle("is-presenting", on);
      if (!on) {
        document.body.classList.remove("is-chrome-visible");
        clearTimeout(chromeHideTimer);
      }
    }

    function revealChrome() {
      if (!state.autoplay) return;
      document.body.classList.add("is-chrome-visible");
      clearTimeout(chromeHideTimer);
      chromeHideTimer = setTimeout(() => {
        document.body.classList.remove("is-chrome-visible");
      }, 2600);
    }

    function startAutoplay() {
      if (state.editing) return;
      state.autoplay = true;
      setPresenting(true);
      syncPlaybackControls();
      scheduleNextView();
      showStatus(`Autoplay started · ${state.intervalSeconds} sec`);
    }

    function stopAutoplay(message = "Autoplay stopped") {
      state.autoplay = false;
      setPresenting(false);
      clearAutoplayTimer();
      syncPlaybackControls();
      showStatus(message);
    }

    function bindEditableFields() {
      board.querySelectorAll("input[data-path]").forEach(input => input.addEventListener("input", () => {
        const path = input.dataset.path;
        let value;
        if (input.dataset.kind === "number") value = Number(input.value);
        else if (input.dataset.kind === "date") {
          if (!input.value) return;
          const parsed = new Date(`${input.value}T00:00:00`);
          if (Number.isNaN(parsed.getTime())) return;
          value = formatBoardDate(parsed);
        } else value = input.value;

        setAtPath(state.data, path, value);

        board.querySelectorAll(`input[data-path="${CSS.escape(path)}"]`).forEach(peer => {
          if (peer === input) return;
          if (peer.dataset.kind === "date") peer.value = toDateInputValue(String(value));
          else if (String(peer.value) !== String(value)) peer.value = value;
        });

        if (path === "date.display") {
          syncDateDerivedFields(String(value));
          window.DiveTide?.refresh?.();
        }
        if (/\.groups\.\d+\.dm$/.test(path) || /\.divers\.\d+\.name$/.test(path)) {
          updateLiveDerivedDisplays();
        }

        saveState();
      }));
    }

    function createDmId() {
      return `dm-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 7)}`;
    }

    function getDmRoster() {
      if (!Array.isArray(state.data.dmRoster)) state.data.dmRoster = [];
      return state.data.dmRoster;
    }

    function findDmById(id) {
      if (!id) return null;
      return getDmRoster().find(item => item.id === id) || null;
    }

    function findDmByName(name) {
      const normalized = String(name ?? "").trim().toLowerCase();
      if (!normalized || normalized === "-" || normalized === "—" || normalized === "unassigned" || normalized === "?") return null;
      return getDmRoster().find(item => String(item.name || "").trim().toLowerCase() === normalized) || null;
    }

    function resolveDmRecord(group) {
      return findDmById(group?.dmId) || findDmByName(group?.dm);
    }

    function resolveDmName(group) {
      const record = resolveDmRecord(group);
      if (record?.name) return record.name;
      const raw = String(group?.dm ?? "").trim();
      return raw || "-";
    }

    function dmInitials(name) {
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return "?";
      return parts.slice(0, 2).map(part => part[0]?.toUpperCase() || "").join("") || "?";
    }

    function renderDmPhoto(group) {
      const record = resolveDmRecord(group);
      const name = resolveDmName(group);
      if (record?.photo) {
        return `<div class="dm-photo" aria-hidden="true"><img src="${escapeHTML(record.photo)}" alt=""></div>`;
      }
      const open = !name || ["-", "—", "unassigned", "?"].includes(name.toLowerCase());
      return `<div class="dm-photo" aria-hidden="true">${open ? "?" : escapeHTML(dmInitials(name))}</div>`;
    }

    function renderDmSelect(groupIndex, group) {
      const roster = getDmRoster();
      const selectedId = group.dmId || findDmByName(group.dm)?.id || "";
      const options = [
        `<option value="">Unassigned</option>`,
        ...roster.map(item => {
          const label = item.name?.trim() || "Untitled DM";
          const selected = item.id === selectedId ? " selected" : "";
          return `<option value="${escapeHTML(item.id)}"${selected}>${escapeHTML(label)}</option>`;
        })
      ].join("");
      return `<select class="dm-select" data-dm-select="${groupIndex}" aria-label="Select DM for group ${groupIndex + 1}">${options}</select>`;
    }

    function renderActivitySelect(groupIndex, group) {
      const selected = group.activity === "fundive" || group.activity === "courses" ? group.activity : "";
      const option = (value, label) => `<option value="${value}"${selected === value ? " selected" : ""}>${label}</option>`;
      return `<select class="activity-select" data-activity-select="${groupIndex}" aria-label="Fundive or courses for group ${groupIndex + 1}">${option("", "Type")}${option("fundive", "Fundive")}${option("courses", "Courses")}</select>`;
    }

    function renderCourseSelect(groupIndex, group) {
      const selected = group.course === "AOW" ? "AOW" : group.course === "OW" ? "OW" : "";
      const option = (value, label) => `<option value="${value}"${selected === value ? " selected" : ""}>${label}</option>`;
      return `<select class="course-select" data-course-select="${groupIndex}" aria-label="OW or AOW for group ${groupIndex + 1}">${option("", "Level")}${option("OW", "OW")}${option("AOW", "AOW")}</select>`;
    }

    function syncGroupDmLabelsFromRoster() {
      const roster = getDmRoster();
      const byId = Object.fromEntries(roster.map(item => [item.id, item]));
      for (const id of requiredSessionIds) {
        for (const group of state.data.sessions[id].groups) {
          if (group.dmId && byId[group.dmId]) {
            group.dm = byId[group.dmId].name?.trim() || "unassigned";
            if (!group.dm) group.dm = "unassigned";
          } else if (group.dmId && !byId[group.dmId]) {
            group.dmId = "";
            group.dm = "unassigned";
          }
        }
      }
    }

    async function fileToDmPhoto(file) {
      if (!file || !file.type.startsWith("image/")) throw new Error("Not an image");
      const objectUrl = URL.createObjectURL(file);
      try {
        const image = await new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error("Could not read image"));
          img.src = objectUrl;
        });
        const maxWidth = 360;
        const maxHeight = 520;
        const scale = Math.min(1, maxWidth / image.width, maxHeight / image.height);
        const width = Math.max(1, Math.round(image.width * scale));
        const height = Math.max(1, Math.round(image.height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#f4f7f7";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(image, 0, 0, width, height);
        return canvas.toDataURL("image/jpeg", 0.74);
      } finally {
        URL.revokeObjectURL(objectUrl);
      }
    }

    function renderDmRosterPanel() {
      const list = document.querySelector("#dm-roster-list");
      const roster = getDmRoster();
      if (!roster.length) {
        list.innerHTML = `<p class="dm-roster-empty">No dive masters yet. Upload a photo, then type the name under it.</p>`;
        return;
      }
      list.innerHTML = roster.map((item, index) => `
        <article class="dm-roster-card" data-dm-id="${escapeHTML(item.id)}">
          <div class="dm-photo">${item.photo ? `<img src="${escapeHTML(item.photo)}" alt="">` : escapeHTML(dmInitials(item.name))}</div>
          <input type="text" data-dm-name="${escapeHTML(item.id)}" aria-label="DM name ${index + 1}" placeholder="Type DM name" value="${escapeHTML(item.name || "")}">
          <div class="dm-roster-card-actions">
            <label class="import-button" style="display:inline-grid;place-items:center;min-height:34px;padding:0 11px;border:1px solid rgba(18,59,75,.2);border-radius:4px;background:#faf8f2;cursor:pointer;font:750 10px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;">
              Replace photo
              <input type="file" accept="image/*" data-dm-replace="${escapeHTML(item.id)}" hidden>
            </label>
            <button type="button" class="danger" data-dm-remove="${escapeHTML(item.id)}">Remove</button>
          </div>
        </article>`).join("");

      list.querySelectorAll("[data-dm-name]").forEach(input => {
        input.addEventListener("input", () => {
          const record = findDmById(input.dataset.dmName);
          if (!record) return;
          record.name = input.value;
          syncGroupDmLabelsFromRoster();
          saveState();
        });
      });
      list.querySelectorAll("[data-dm-remove]").forEach(button => {
        button.addEventListener("click", () => {
          const id = button.dataset.dmRemove;
          state.data.dmRoster = getDmRoster().filter(item => item.id !== id);
          syncGroupDmLabelsFromRoster();
          saveState();
          renderDmRosterPanel();
          if (state.activeView !== "overview") renderApp();
        });
      });
      list.querySelectorAll("[data-dm-replace]").forEach(input => {
        input.addEventListener("change", async () => {
          const file = input.files?.[0];
          input.value = "";
          if (!file) return;
          try {
            const record = findDmById(input.dataset.dmReplace);
            if (!record) return;
            record.photo = await fileToDmPhoto(file);
            saveState();
            renderDmRosterPanel();
            if (state.activeView !== "overview") renderApp();
            showStatus("DM photo updated");
          } catch (error) {
            showStatus("Could not update photo", "error");
          }
        });
      });
    }

    function openDmRoster() {
      document.querySelector("#dm-roster-modal").hidden = false;
      renderDmRosterPanel();
    }

    function closeDmRoster() {
      document.querySelector("#dm-roster-modal").hidden = true;
      syncGroupDmLabelsFromRoster();
      saveState();
      renderApp();
    }

    function bindDmSelects() {
      board.querySelectorAll("[data-dm-select]").forEach(select => {
        select.addEventListener("change", () => {
          const groupIndex = Number(select.dataset.dmSelect);
          const group = state.data.sessions[state.activeView]?.groups?.[groupIndex];
          if (!group) return;
          const record = findDmById(select.value);
          if (!record) {
            group.dmId = "";
            group.dm = "unassigned";
          } else {
            group.dmId = record.id;
            group.dm = record.name?.trim() || "unassigned";
          }
          updateLiveDerivedDisplays();
          saveState();
          renderApp();
        });
      });
    }

    function bindActivitySelects() {
      board.querySelectorAll("[data-activity-select]").forEach(select => {
        select.addEventListener("change", () => {
          const groupIndex = Number(select.dataset.activitySelect);
          const group = state.data.sessions[state.activeView]?.groups?.[groupIndex];
          if (!group) return;
          group.activity = select.value === "fundive" || select.value === "courses" ? select.value : "";
          if (group.activity === "courses") {
            if (group.course !== "OW" && group.course !== "AOW") group.course = "OW";
          } else {
            group.course = "";
          }
          saveState();
          renderApp();
        });
      });
      board.querySelectorAll("[data-course-select]").forEach(select => {
        select.addEventListener("change", () => {
          const groupIndex = Number(select.dataset.courseSelect);
          const group = state.data.sessions[state.activeView]?.groups?.[groupIndex];
          if (!group) return;
          group.activity = "courses";
          group.course = select.value === "AOW" ? "AOW" : select.value === "OW" ? "OW" : "";
          saveState();
          renderApp();
        });
      });
    }

    function isPlaceholderName(name) {
      const normalized = String(name ?? "").trim().toLowerCase();
      return !normalized || normalized === "-" || normalized === "—" || normalized === "open";
    }

    function isPlaceholderDm(dm) {
      const normalized = String(dm ?? "").trim().toLowerCase();
      return !normalized || normalized === "-" || normalized === "—" || normalized === "unassigned" || normalized === "?";
    }

    function countGroupDivers(group) {
      return (group?.divers || []).filter(diver => !isPlaceholderName(diver?.name)).length;
    }

    function capacityMax(capacity, fallback = 3) {
      const match = String(capacity ?? "").trim().match(/^(?:\d+|-)\s*\/\s*(\d+)$/);
      return match ? Number(match[1]) : fallback;
    }

    function computeSessionTotals(session) {
      let divers = 0;
      let dmGroups = 0;
      for (const group of session?.groups || []) {
        divers += countGroupDivers(group);
        if (!isPlaceholderDm(group.dm)) dmGroups += 1;
      }
      return { dmGroups, divers };
    }

    function formatSessionSummary(dmGroups, divers) {
      return `${dmGroups} DM · ${divers} DIVERS`;
    }

    function syncDerivedCounts(data = state.data) {
      if (!data?.overview || !data?.sessions) return data;
      for (const item of data.overview) {
        const session = data.sessions[item.id];
        if (!session) continue;
        for (const group of session.groups || []) {
          group.capacity = `${countGroupDivers(group)}/${capacityMax(group.capacity)}`;
        }
        const totals = computeSessionTotals(session);
        item.dmGroups = totals.dmGroups;
        item.divers = totals.divers;
        session.summary = formatSessionSummary(totals.dmGroups, totals.divers);
      }
      return data;
    }

    function updateLiveDerivedDisplays() {
      syncDerivedCounts();
      if (state.activeView === "overview") {
        state.data.overview.forEach((item, index) => {
          const dmNode = board.querySelector(`[data-auto-metric="overview.${index}.dmGroups"]`);
          const diversNode = board.querySelector(`[data-auto-metric="overview.${index}.divers"]`);
          const column = board.querySelector(`[data-slot="${CSS.escape(item.id)}"]`);
          const empty = Number(item.dmGroups) === 0 && Number(item.divers) === 0;
          if (dmNode) dmNode.textContent = String(item.dmGroups);
          if (diversNode) diversNode.textContent = String(item.divers);
          if (column) column.dataset.empty = String(empty);
        });
        return;
      }
      const session = state.data.sessions[state.activeView];
      if (!session) return;
      const totals = computeSessionTotals(session);
      const dmNode = board.querySelector("[data-auto-session-dm]");
      const diversNode = board.querySelector("[data-auto-session-divers]");
      if (dmNode) dmNode.textContent = String(totals.dmGroups);
      if (diversNode) diversNode.textContent = String(totals.divers);
      session.groups.forEach((group, groupIndex) => {
        const capacityNode = board.querySelector(`[data-auto-capacity="${groupIndex}"]`);
        const cell = board.querySelector(`[data-group-index="${groupIndex}"]`);
        if (capacityNode) capacityNode.textContent = group.capacity;
        if (cell) cell.dataset.empty = String(isGroupEmpty(group));
      });
    }

    function groupGuestNames(group) {
      return (group?.divers || []).slice(0, 3).map(diver => String(diver?.name ?? "").trim());
    }

    function sortGuestNames(names) {
      return [...names].sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base", numeric: true }));
    }

    function parseNameList(text) {
      return String(text ?? "")
        .split(/[\n\r,;|]+/)
        .map(name => name.trim())
        .filter(name => !isPlaceholderName(name));
    }

    function applySortedNamesToGroup(groupIndex, rawNames) {
      const group = state.data.sessions[state.activeView]?.groups?.[groupIndex];
      if (!group) return 0;
      const sorted = sortGuestNames(parseNameList(Array.isArray(rawNames) ? rawNames.join("\n") : rawNames)).slice(0, 3);
      for (let index = 0; index < 3; index += 1) {
        if (!group.divers[index]) group.divers[index] = { name: "-", note: "-" };
        group.divers[index].name = sorted[index] || "-";
      }
      syncDerivedCounts();
      return sorted.length;
    }

    async function copyText(text) {
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(text);
        return;
      }
      const area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.opacity = "0";
      document.body.append(area);
      area.select();
      const ok = document.execCommand("copy");
      area.remove();
      if (!ok) throw new Error("Copy failed");
    }

    async function readClipboardText() {
      if (navigator.clipboard?.readText) return navigator.clipboard.readText();
      throw new Error("Clipboard read unavailable");
    }

    function flashActionButton(button, key, idleLabel, activeLabel) {
      button.dataset[key] = "true";
      button.textContent = activeLabel;
      setTimeout(() => {
        button.dataset[key] = "false";
        button.textContent = idleLabel;
      }, 1600);
    }

    function bindCopyNameButtons() {
      board.querySelectorAll("[data-copy-group]").forEach(button => {
        button.addEventListener("click", async event => {
          event.preventDefault();
          event.stopPropagation();
          const groupIndex = Number(button.dataset.copyGroup);
          const session = state.data.sessions[state.activeView];
          const group = session?.groups?.[groupIndex];
          if (!group) {
            showStatus("Could not find this group", "error");
            return;
          }
          const usable = sortGuestNames(groupGuestNames(group).filter(name => !isPlaceholderName(name)));
          const text = usable.join("\n");
          if (!text) {
            showStatus("No guest names to copy", "error");
            return;
          }
          try {
            await copyText(text);
            flashActionButton(button, "copied", "Copy names", "Copied");
            showStatus(`Copied ${usable.length} guest name${usable.length === 1 ? "" : "s"}`);
          } catch (error) {
            showStatus("Could not copy names", "error");
          }
        });
      });

      board.querySelectorAll("[data-paste-group]").forEach(button => {
        button.addEventListener("click", async event => {
          event.preventDefault();
          event.stopPropagation();
          const groupIndex = Number(button.dataset.pasteGroup);
          try {
            const text = await readClipboardText();
            const count = applySortedNamesToGroup(groupIndex, text);
            if (!count) {
              showStatus("No guest names found to paste", "error");
              return;
            }
            saveState();
            renderApp();
            showStatus(`Pasted ${count} name${count === 1 ? "" : "s"} into this group`);
          } catch (error) {
            showStatus("Could not paste names — allow clipboard access or use Edit + Ctrl/Cmd+V", "error");
          }
        });
      });
    }

    function bindNamePasteDistribution() {
      board.querySelectorAll('input[data-path*=".divers."][data-path$=".name"]').forEach(input => {
        input.addEventListener("paste", event => {
          const text = event.clipboardData?.getData("text") ?? "";
          const names = parseNameList(text);
          if (names.length <= 1) return;
          const match = input.dataset.path.match(/^sessions\.[^.]+\.groups\.(\d+)\.divers\.\d+\.name$/);
          if (!match) return;
          event.preventDefault();
          const count = applySortedNamesToGroup(Number(match[1]), names);
          saveState();
          renderApp();
          showStatus(`Pasted ${count} name${count === 1 ? "" : "s"} into this group`);
        });
      });
    }

    function renderApp() {
      syncDerivedCounts();
      board.innerHTML = state.activeView === "overview"
        ? renderOverview(state.data)
        : renderSession(state.data.sessions[state.activeView], state.data);
      syncNavigation();
      syncPlaybackControls();
      setPresenting(state.autoplay && !state.editing);
      document.body.classList.toggle("is-editing", state.editing);
      editToggle.setAttribute("aria-pressed", String(state.editing));
      editToggle.textContent = state.editing ? "Finish editing" : "Edit board";
      bindEditableFields();
      bindCopyNameButtons();
      bindNamePasteDistribution();
      bindDmSelects();
      bindActivitySelects();
      board.querySelectorAll("[data-jump]").forEach(button => button.addEventListener("click", () => {
        setActiveView(button.dataset.jump);
      }));
      board.querySelectorAll("[data-jump]").forEach(button => button.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          setActiveView(button.dataset.jump);
        }
      }));
      window.DiveTide?.refresh?.();
    }

    function exportData() {
      try {
        const blob = new Blob([JSON.stringify(state.data, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `tulamben-dive-board-${state.data.date.display.replace(/\s+/g, "-").toLowerCase()}.json`;
        document.body.append(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 0);
        showStatus("Board data exported");
      } catch (error) {
        showStatus("Could not export board data", "error");
      }
    }

    async function importData(file) {
      if (!file) return;
      try {
        const candidate = JSON.parse(await file.text());
        if (!validateData(candidate)) throw new Error("Invalid board structure");
        state.data = ensureDmRoster(normalizeGroupCount(candidate));
        saveState();
        renderApp();
        showStatus("Board data imported");
      } catch (error) {
        showStatus("Import failed — the current board was not changed", "error");
      }
    }

    function resetData() {
      if (!confirm("Restore the original board data? Saved edits will be removed.")) return;
      state.data = ensureDmRoster(structuredClone(BOARD_DATA));
      stampBoardToToday(state.data);
      saveState();
      renderApp();
      showStatus("Original board restored");
    }

    navButtons.forEach(button => button.addEventListener("click", () => {
      setActiveView(button.dataset.view);
    }));

    editToggle.addEventListener("click", () => {
      state.editing = !state.editing;
      if (state.editing) stopAutoplay("Autoplay paused for editing");
      renderApp();
      if (state.editing) board.querySelector("input, select")?.focus();
    });

    document.querySelector("#dm-roster-toggle").addEventListener("click", openDmRoster);
    document.querySelector("#dm-roster-close").addEventListener("click", closeDmRoster);
    document.querySelector("#dm-roster-done").addEventListener("click", closeDmRoster);
    document.querySelector("#dm-roster-modal").addEventListener("click", event => {
      if (event.target.id === "dm-roster-modal") closeDmRoster();
    });
    document.querySelector("#dm-roster-add-blank").addEventListener("click", () => {
      getDmRoster().push({ id: createDmId(), name: "", photo: "" });
      saveState();
      renderDmRosterPanel();
    });
    document.querySelector("#dm-roster-upload").addEventListener("change", async event => {
      const files = [...(event.target.files || [])];
      event.target.value = "";
      if (!files.length) return;
      try {
        for (const file of files) {
          const photo = await fileToDmPhoto(file);
          const guessed = file.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " ").trim();
          getDmRoster().push({ id: createDmId(), name: guessed, photo });
        }
        saveState();
        renderDmRosterPanel();
        showStatus(`Added ${files.length} DM photo${files.length === 1 ? "" : "s"}`);
      } catch (error) {
        showStatus("Could not upload DM photo", "error");
      }
    });
    document.querySelector("#export-button").addEventListener("click", exportData);
    document.querySelector("#import-input").addEventListener("change", event => {
      importData(event.target.files?.[0]);
      event.target.value = "";
    });
    document.querySelector("#reset-button").addEventListener("click", resetData);

    autoplayToggle.addEventListener("click", () => {
      if (state.autoplay) stopAutoplay();
      else startAutoplay();
    });

    loopToggle.addEventListener("click", () => {
      state.loop = !state.loop;
      savePlaybackPreferences();
      syncPlaybackControls();
      if (state.autoplay) scheduleNextView();
    });

    intervalSelect.addEventListener("change", () => {
      const custom = intervalSelect.value === "custom";
      customIntervalControl.hidden = !custom;
      if (custom) {
        customInterval.focus();
        return;
      }
      state.intervalSeconds = Number(intervalSelect.value);
      savePlaybackPreferences();
      syncPlaybackControls();
      if (state.autoplay) scheduleNextView();
    });

    function applyCustomInterval(showError = false) {
      if (!validInterval(customInterval.value)) {
        if (showError) {
          customInterval.value = String(state.intervalSeconds);
          showStatus("Enter a whole number from 1 to 3600 seconds", "error");
        }
        return false;
      }
      state.intervalSeconds = Number(customInterval.value);
      savePlaybackPreferences();
      if (state.autoplay) scheduleNextView();
      return true;
    }

    customInterval.addEventListener("input", () => {
      if (!applyCustomInterval(false)) {
        customInterval.setAttribute("aria-invalid", "true");
        showStatus("Enter a whole number from 1 to 3600 seconds", "error");
        return;
      }
      customInterval.removeAttribute("aria-invalid");
    });

    customInterval.addEventListener("change", () => {
      if (!applyCustomInterval(true)) {
        customInterval.removeAttribute("aria-invalid");
        return;
      }
      customInterval.removeAttribute("aria-invalid");
      syncPlaybackControls();
    });

    document.addEventListener("mousemove", revealChrome);
    document.addEventListener("pointerdown", revealChrome);

    document.addEventListener("keydown", event => {
      const tag = event.target?.tagName;
      if (["INPUT", "TEXTAREA", "SELECT"].includes(tag)) return;
      if (event.key === "Escape" && state.editing) {
        state.editing = false;
        renderApp();
        editToggle.focus();
        return;
      }
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      const direction = event.key === "ArrowRight" ? 1 : -1;
      const current = VIEWS.indexOf(state.activeView);
      setActiveView(VIEWS[(current + direction + VIEWS.length) % VIEWS.length]);
    });

    if (stampBoardToToday(state.data)) persistBoardQuietly();
    syncDerivedCounts();
    renderApp();
    armDateRollover();

    window.DiveBoard = {
      getData() {
        return state.data;
      },
      getDateISO() {
        const parsed = parseBoardDate(state.data.date.display);
        if (!parsed) return null;
        const month = String(parsed.getMonth() + 1).padStart(2, "0");
        const day = String(parsed.getDate()).padStart(2, "0");
        return `${parsed.getFullYear()}-${month}-${day}`;
      },
      getSlots() {
        return (state.data.overview || []).map(item => ({ id: item.id, time: item.time }));
      },
      applyBoardData(next) {
        try {
          state.data = ensureDmRoster(next);
          saveState();
          renderApp();
        } catch (error) {
          showStatus("Could not apply AI changes", "error");
        }
      }
    };
  </script>
  <script>
    window.DIVE_BOARD_AI_API_URL = window.DIVE_BOARD_AI_API_URL || "";
    window.VITE_AI_API_URL = window.VITE_AI_API_URL || window.DIVE_BOARD_AI_API_URL || "";
  </script>
  <script type="module" src="js/ai-assistant.js"></script>
  <script type="module" src="js/tide-board.js"></script>
</body>
</html>
